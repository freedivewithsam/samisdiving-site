    --accent:var(--sw-pink); --accent-dark:#DD7B9C; --rose:var(--sw-pink-lt); --rose-line:#F2C4D3;
    --ok:#5E9488; --ok-bg:var(--sw-mint-lt); --info:#4A6E8F; --info-bg:var(--sw-blue-lt);
    --radius:14px; --shadow:0 1px 3px rgba(74,55,64,.08), 0 6px 18px rgba(74,55,64,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Poppins",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; min-height:100vh;
  }
  input,select,textarea,button{font-family:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 80px}

  header.app{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .brand h1{font-family:"Poppins",serif;font-weight:600;font-size:24px;margin:0}
  .brand p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
  .brand h1 .wave{color:var(--accent-dark)}

  .btn{border:none;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;display:inline-block;text-decoration:none}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--sw-pink);color:var(--ink);border:1px solid var(--accent-dark)}
  .btn-primary:hover{background:var(--accent-dark);color:#fff}
  .btn-ghost{background:var(--rose);color:var(--ink);border:1.5px solid var(--rose-line)}
  .btn-ghost:hover{background:var(--sw-pink)}
  .btn-blue{background:var(--sw-blue-lt);color:var(--ink);border:1px solid #B7CBDA}
  .btn-blue:hover{filter:brightness(.96)}
  .btn-small{padding:6px 13px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}

  .card{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px;flex-wrap:wrap}
  h2.section{font-family:"Poppins",serif;font-weight:600;font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
  .empty-note{color:var(--ink-soft);font-size:13.5px;font-style:italic}

  .tab-bar{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
  .tab-btn{background:var(--rose);color:var(--ink-soft);border:1.5px solid var(--rose-line);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
  .tab-btn.active{background:var(--sw-pink);color:var(--ink);border-color:var(--accent-dark)}

  .todo-group{margin-bottom:20px}
  .todo-group:last-child{margin-bottom:0}
  .todo-group h3{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
  .todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--rose-line);border-radius:12px;margin-bottom:8px;background:var(--card)}
  .todo-item.done{background:var(--ok-bg);border-color:var(--ok)}
  .todo-item input[type="checkbox"]{width:19px;height:19px;accent-color:var(--accent-dark);cursor:pointer;flex:none}
  .todo-item .todo-text{flex:1;font-size:14.5px}
  .todo-item.done .todo-text{text-decoration:line-through;color:var(--ink-soft)}
  .todo-item .todo-del,.todo-item .todo-edit{flex:none;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;line-height:1;padding:4px}
  .todo-item .todo-del:hover{color:#B03030}
  .todo-item .todo-edit:hover{color:var(--accent-dark)}
  .todo-item .todo-video{flex:none;color:var(--info);text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:3px;padding:4px 2px}
  .todo-item .todo-video:hover{text-decoration:underline}
  .todo-edit-form{border:1.5px solid var(--rose-line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--card)}
  .todo-edit-form .row{margin-bottom:8px}
  .todo-history{display:flex;gap:5px;flex-wrap:wrap;margin:-2px 0 12px 45px}
  .todo-hist-dot{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--rose-line);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--ink-soft);background:var(--card);cursor:default}
  .todo-hist-dot.checked{background:var(--ok);border-color:var(--ok);color:#fff}

  .session-card{position:relative}
  .session-date{font-size:12px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .session-block{margin-bottom:10px}
  .session-block:last-child{margin-bottom:0}
  .session-block .lbl{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .session-block .txt{white-space:pre-wrap;font-size:14.5px}

  .fb-table{width:100%;border-collapse:collapse;margin-top:2px}
  .fb-table td{border:1px solid var(--rose-line);padding:8px 10px;font-size:14px;vertical-align:top}
  .fb-table td.fb-topic{width:30%;font-weight:600;background:var(--rose)}
  .fb-table td.fb-notes{white-space:pre-wrap}

  .fb-edit-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
  .fb-edit-row input.fb-topic-in{width:30%;flex:none;padding:9px 10px;border:1.5px solid var(--rose-line);border-radius:10px;font-size:14px}
  .fb-edit-row textarea.fb-notes-in{flex:1;min-height:44px;resize:none;overflow:hidden;padding:9px 10px;border:1.5px solid var(--rose-line);border-radius:10px;font-size:14px;font-family:inherit;line-height:1.4}
  .fb-edit-row .fb-remove{flex:none;align-self:flex-start}

  .settings-wrap{position:relative}
  .settings-panel{position:fixed;z-index:60;width:250px;max-width:calc(100vw - 24px);text-align:left}

  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field textarea,.field select{
    width:100%;padding:10px 12px;border:1.5px solid var(--rose-line);border-radius:10px;
    font-size:14.5px;color:var(--ink);background:#fff;
  }
  .field textarea{min-height:80px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent-dark)}
  .field{margin-bottom:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  .row.tight{align-items:center}
  .row.tight>*{flex:none;min-width:0}

  .chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .chip-info{background:var(--info-bg);color:var(--info)}
  .chip-ok{background:var(--ok-bg);color:var(--ok)}

  .msg{font-size:13px;margin-top:8px}
  .msg.err{color:#B03030}
  .msg.ok{color:var(--ok)}

  /* PIN lock */
  #pinLockScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .pin-box{width:100%;max-width:320px;text-align:center}
  .pin-box .logo{font-family:"Poppins",serif;font-weight:600;font-size:24px;margin-bottom:4px}
  .pin-box .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:22px}
  #pinDots{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--rose-line);background:transparent;transition:background .1s,border-color .1s}
  .pin-dot.filled{background:var(--accent-dark);border-color:var(--accent-dark)}
  .pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
  .pin-key{padding:16px 0;border-radius:14px;border:1.5px solid var(--rose-line);background:#fff;font-size:19px;font-weight:600;cursor:pointer;color:var(--ink)}
  .pin-key:active{background:var(--rose)}
  .pin-key.wide{grid-column:span 1;font-size:14px;color:var(--ink-soft);border:none;background:transparent}
  #pinError{color:#B03030;font-size:13px;min-height:18px;margin-top:12px}

  #addStudentBtn,#deleteStudentBtn{height:44px;display:flex;align-items:center;justify-content:center}
  @media (max-width:480px){
    .wrap{padding:16px 12px 60px}
    .brand h1{font-size:21px}
    .row{flex-direction:column}
    .row.tight{flex-direction:row}
  }
</style>
</head>
<body>

  <div class="pin-box">
    <div class="logo">DNF online coaching</div>

    <div class="field" id="pinNameWrap" style="text-align:left;max-width:260px;margin:0 auto 12px"><input id="pinName" placeholder="your name" autocomplete="off"></div>

  <!-- ADMIN: student picker -->

<script>
/* ======================= CONFIG — fill this in ======================= */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxzsiz4NVn2KrvSfzkpUBTHsCxuTFML2YKnD0kgwNgnx3vtomfWgZWYwBKWYZg0xsl0fw/exec';
/* ======================================================================= */

const TOKEN_KEY = 'freedive-session-token';
let session = { token: null, role: null, studentId: null, name: null };
let viewingStudentId = null; // whichever student's data is currently shown
let editingSessionDate = null; // null = creating a new session; else the date being edited
let selectedSessionDate = null; // which session the dropdown currently shows
let fbEditRows = []; // [{topic, notes}] while the session form is open
let hwEditRows = []; // same, for homework

/* ---------------- backend call ---------------- */
async function callOnce(action, params){
  const body = Object.assign({ action: action, token: session.token }, params || {});
  const res = await fetch(BACKEND_URL, { method:'POST', body: JSON.stringify(body) });
  return await res.json();
}
/* A single authError right after logging in is sometimes just a transient
   hiccup rather than a truly dead session — so retry once, silently,
   before kicking the person back to the PIN screen. Network hiccups
   (caught below) get the same one-retry treatment. */
async function call(action, params){
  let json;
  try{
    json = await callOnce(action, params);
  }catch(e){
    try{ json = await callOnce(action, params); }
    catch(e2){ return { ok:false, error:'could not reach the server — check your connection.' }; }
  }
  if(json && json.authError){
    try{
      const retry = await callOnce(action, params);
      if(!(retry && retry.authError)) return retry;
      json = retry;
    }catch(e){ /* fall through to relock below */ }
    relock('session expired — enter your PIN');
  }
  return json;
}

/* ---------------- PIN lock ---------------- */
let pinEntry = '';
const pinDots = Array.from(document.querySelectorAll('.pin-dot'));
const pinErr = document.getElementById('pinError');
const pinSub = document.getElementById('pinSub');

function renderDots(){
  pinDots.forEach((d,i)=> d.classList.toggle('filled', i < pinEntry.length));
}
const PIN_LENGTH = 4;

function pressKey(k){
  if(k === 'clear'){ pinEntry=''; }
  else if(k === 'back'){ pinEntry = pinEntry.slice(0,-1); }
  else if(pinEntry.length < PIN_LENGTH){ pinEntry += k; }
  renderDots();
  pinErr.textContent = '';
  if(k !== 'back' && k !== 'clear' && pinEntry.length === PIN_LENGTH){
    trySubmitPin(); // exactly 4 digits — log in right away
  }
}
document.getElementById('pinKeypad').addEventListener('click', (e)=>{
  const btn = e.target.closest('.pin-key');
  if(!btn) return;
  pressKey(btn.dataset.k);
});
/* Real keyboard: digits 0-9 type into the PIN, Backspace deletes,
   Escape clears — so a keyboard-and-mouse user never has to click. */
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('pinLockScreen').style.display === 'none') return;
  if(e.target && e.target.id === 'pinName' && e.key !== 'Escape') return;
  if(e.key >= '0' && e.key <= '9'){ pressKey(e.key); }
  else if(e.key === 'Backspace'){ pressKey('back'); }
  else if(e.key === 'Escape'){ pressKey('clear'); }
});
const pinNameInput = document.getElementById('pinName');
async function trySubmitPin(){
  const attempt = pinEntry;
  const name = pinNameInput.value.trim();
  pinSub.textContent = 'checking…';
  // The device's own timezone — used so a student's daily/weekly/monthly
  // to-dos roll over at THEIR midnight, not the Sheet's timezone. Silently
  // omitted if the browser doesn't support the API.
  let tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  const resp = await call('login', { name: name, pin: attempt, tz: tz });
  if(resp && resp.ok){
    session.token = resp.token; session.role = resp.role; session.studentId = resp.studentId; session.name = resp.name;
    try{ sessionStorage.setItem(TOKEN_KEY, JSON.stringify(session)); }catch(e){}
    enterApp();
  } else if(pinEntry === attempt){
    // only show an error if they haven't kept typing past this attempt
    pinErr.textContent = (resp && resp.error) ? resp.error : 'wrong name or PIN — try again.';
    pinSub.textContent = 'enter your name and PIN';
    pinEntry=''; renderDots();
  }
}
function relock(msg){
  session = { token:null, role:null, studentId:null, name:null };
  try{ sessionStorage.removeItem(TOKEN_KEY); }catch(e){}
  document.getElementById('appWrap').style.display='none';
  document.getElementById('pinLockScreen').style.display='flex';
  pinSub.textContent = msg || 'enter your name and PIN';
  pinEntry=''; renderDots();
  pinNameInput.value='';
}
document.getElementById('logoutBtn').addEventListener('click', ()=> relock());

/* try to resume a session already in sessionStorage */
(function tryResume(){
  try{
    const raw = sessionStorage.getItem(TOKEN_KEY);
    if(raw){ session = JSON.parse(raw); if(session && session.token){ enterApp(); return; } }
  }catch(e){}
})();

/* ---------------- app shell ---------------- */
function enterApp(){
  document.getElementById('pinLockScreen').style.display='none';
  document.getElementById('appWrap').style.display='block';
  document.getElementById('whoami').textContent = session.role==='admin' ? 'coach view' : ('hi, ' + session.name + '!');

  document.getElementById('settingsWrap').style.display='block';
  document.getElementById('pinChangeSection').style.display = session.role==='student' ? 'block' : 'none';
  document.getElementById('albumLinkSection').style.display = session.role==='admin' ? 'block' : 'none';
  document.getElementById('studentAlbumSection').style.display = session.role==='student' ? 'block' : 'none';

  document.getElementById('navBtn').style.display = session.role==='admin' ? 'inline-block' : 'none';
  document.getElementById('newSessionBtn').style.display = session.role==='admin' ? 'inline-block' : 'none';
  document.getElementById('addTodoBtn').style.display = session.role==='admin' ? 'inline-block' : 'none';

  if(session.role === 'admin'){
    document.getElementById('adminBar').style.display='block';
    loadStudentList();
  } else {
    viewingStudentId = session.studentId;
    document.getElementById('studentArea').style.display='block';
    loadStudentData();
  }
}

document.getElementById('sessionsTabBtn').addEventListener('click', ()=> switchTab('sessions'));
document.getElementById('todosTabBtn').addEventListener('click', ()=> switchTab('todos'));
function switchTab(tab){
  document.getElementById('sessionsTab').style.display = tab==='sessions' ? 'block' : 'none';
  document.getElementById('todosTab').style.display = tab==='todos' ? 'block' : 'none';
  document.getElementById('sessionsTabBtn').classList.toggle('active', tab==='sessions');
  document.getElementById('todosTabBtn').classList.toggle('active', tab==='todos');
}

/* The panel is position:fixed and placed here in JS (not pinned via CSS
   right:0) so it's clamped to the actual viewport — on a narrow phone a
   plain "anchor to the button's corner" can push part of the popup off
   the edge of the screen; this keeps the whole box on-screen no matter
   how small or how the header has wrapped. */
function positionSettingsPanel(){
  const btn = document.getElementById('settingsBtn');
  const p = document.getElementById('settingsPanel');
  const margin = 12;
  const panelWidth = Math.min(250, window.innerWidth - margin*2);
  const btnRect = btn.getBoundingClientRect();
  let left = btnRect.right - panelWidth; // align panel's right edge under the button
  left = Math.max(margin, Math.min(left, window.innerWidth - panelWidth - margin));
  let top = btnRect.bottom + 8;
  top = Math.min(top, window.innerHeight - margin); // don't start below the screen either
  p.style.left = left + 'px';
  p.style.top = top + 'px';
}
document.getElementById('settingsBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const p = document.getElementById('settingsPanel');
  const opening = p.style.display === 'none';
  if(opening) positionSettingsPanel();
  p.style.display = opening ? 'block' : 'none';
});
window.addEventListener('resize', ()=>{
  const p = document.getElementById('settingsPanel');
  if(p.style.display === 'block') positionSettingsPanel();
});
/* Click anywhere outside the settings panel (including right after
   saving a PIN or a photo album link) closes it. */
document.addEventListener('click', (e)=>{
  const wrap = document.getElementById('settingsWrap');
  const panel = document.getElementById('settingsPanel');
  if(!wrap || !panel) return;
  if(panel.style.display !== 'none' && !wrap.contains(e.target)){
    panel.style.display = 'none';
  }
});

let lastStudents = []; // [{studentId, name}] from the last listStudents call

function renderStudentTabs(){
  const bar = document.getElementById('studentTabBar');
  bar.innerHTML = lastStudents.map(s=>
    '<button class="tab-btn'+(s.studentId===viewingStudentId?' active':'')+'" type="button" data-id="'+escapeAttr(s.studentId)+'">'+escapeHtml(s.name)+'</button>'
  ).join('');
  bar.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      if(id === viewingStudentId) return;
      viewingStudentId = id; selectedSessionDate = null; hideSessionForm();
      renderStudentTabs();
      loadStudentData();
    });
  });
}

async function loadStudentList(){
  const resp = await call('listStudents', {});
  const bar = document.getElementById('studentTabBar');
  if(!resp || !resp.ok){ bar.innerHTML = '<span class="empty-note">could not load students.</span>'; return; }
  lastStudents = resp.students;
  if(lastStudents.length === 0){
    bar.innerHTML = '<span class="empty-note">— add your first student —</span>';
    document.getElementById('studentArea').style.display='none';
    return;
  }
  if(!viewingStudentId || !lastStudents.some(s=> s.studentId === viewingStudentId)){
    viewingStudentId = lastStudents[0].studentId;
  }
  renderStudentTabs();
  document.getElementById('studentArea').style.display='block';
  loadStudentData();
}

document.getElementById('addStudentBtn').addEventListener('click', ()=>{
  const c = document.getElementById('addStudentCard');
  c.style.display = c.style.display==='none' ? 'block' : 'none';
});

document.getElementById('deleteStudentBtn').addEventListener('click', async ()=>{
  const studentId = viewingStudentId;
  const found = lastStudents.find(s=> s.studentId === studentId);
  const name = found ? found.name : '';
  const msg = document.getElementById('deleteStudentMsg');
  if(!studentId){ return; }
  const ok = confirm('Delete ' + name + '? This permanently removes their sessions and to-do lists too — this can\'t be undone.');
  if(!ok) return;
  msg.className='msg'; msg.textContent='deleting…';
  const resp = await call('removeStudent', { studentId: studentId });
  if(resp && resp.ok){
    msg.textContent='';
    viewingStudentId = null; selectedSessionDate = null; hideSessionForm();
    loadStudentList();
  } else {
    msg.className='msg err'; msg.textContent = (resp && resp.error) || 'could not delete — try again.';
  }
});
document.getElementById('saveStudentBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newName').value.trim();
  const pin = document.getElementById('newPin').value.trim();
  const msg = document.getElementById('addStudentMsg');

document.getElementById('changePinBtn').addEventListener('click', async ()=>{

let lastSessions = [];
let lastTodos = [];
let currentPhotoAlbumUrl = '';

async function loadStudentData(){
  if(!viewingStudentId) return;
  const resp = await call('getData', { studentId: viewingStudentId });
  if(!resp || !resp.ok){
    document.getElementById('sessionDetail').innerHTML = '<div class="empty-note">' + escapeHtml((resp&&resp.error)||'could not load data') + '</div>';
    return;
  }
  lastSessions = resp.sessions || [];
  renderSessions(lastSessions);
  lastTodos = resp.todos || [];
  renderTodos();
  currentPhotoAlbumUrl = resp.photoAlbumUrl || '';
  if(session.role === 'admin'){
    const albumInput = document.getElementById('albumUrlInput');
    if(albumInput) albumInput.value = currentPhotoAlbumUrl;
    const albumMsg = document.getElementById('albumMsg');
    if(albumMsg) albumMsg.textContent = '';
  }
}

/* ---------------- to-do list ----------------
 * Each to-do repeats daily/weekly/monthly — "checked" reflects only the
 * CURRENT period (today / this week / this month), computed on the
 * backend, so it naturally resets itself once the period rolls over.
 */
const TODO_FREQ_LABELS = { daily: 'daily', weekly: 'weekly', monthly: 'monthly' };
let editingTodoId = null; // todoId currently showing its inline edit form, or null

function renderTodos(){
  const wrap = document.getElementById('todoGroups');
  const isAdmin = session.role === 'admin';
  if(!lastTodos.length){
    wrap.innerHTML = '<div class="empty-note">no to-dos yet.</div>';
    return;
  }
  const groups = { daily: [], weekly: [], monthly: [] };
  lastTodos.forEach(t=> (groups[t.frequency] || groups.daily).push(t));

  wrap.innerHTML = ['daily','weekly','monthly'].map(freq=>{
    const items = groups[freq];
    if(!items.length) return '';
    return '<div class="todo-group"><h3>' + TODO_FREQ_LABELS[freq] + '</h3>' +
      items.map(t=>{
        if(isAdmin && editingTodoId === t.todoId){
          return '<div class="todo-edit-form" data-id="'+escapeAttr(t.todoId)+'">' +
            '<div class="row" style="align-items:flex-end">' +
              '<div class="field" style="margin-bottom:0;flex:2"><label>to-do</label><input class="todo-edit-text" value="'+escapeAttr(t.text)+'"></div>' +
              '<div class="field" style="margin-bottom:0"><label>repeats</label>' +
                '<select class="todo-edit-freq">' +
                  ['daily','weekly','monthly'].map(f=> '<option value="'+f+'"'+(f===t.frequency?' selected':'')+'>'+f+'</option>').join('') +
                '</select></div>' +
            '</div>' +
            '<div class="field" style="margin-bottom:8px"><label>youtube link (optional)</label><input class="todo-edit-video" type="url" value="'+escapeAttr(t.videoUrl||'')+'" placeholder="https://youtube.com/watch?v=..."></div>' +
            '<div class="row tight">' +
              '<button class="btn btn-primary btn-small todo-edit-save" type="button">save</button>' +
              '<button class="btn btn-ghost btn-small todo-edit-cancel" type="button">cancel</button>' +
            '</div>' +
            '<div class="msg todo-edit-msg"></div>' +
          '</div>';
        }
        const past = (t.history || []).slice(0, -1);
        const historyHtml = past.length ? (
          '<div class="todo-history">' +
            past.map(p=>
              '<div class="todo-hist-dot'+(p.checked?' checked':'')+'" title="'+escapeAttr(p.label)+' — '+(p.checked?'done':'not done')+'">' +
                escapeHtml((p.label||'?').charAt(0)) +
              '</div>'
            ).join('') +
          '</div>'
        ) : '';
        const videoHtml = t.videoUrl ? '<a class="todo-video" href="'+escapeAttr(t.videoUrl)+'" target="_blank" rel="noopener">▶ watch</a>' : '';
        return '<div class="todo-item'+(t.checked?' done':'')+'">' +
          '<input type="checkbox" data-id="'+escapeAttr(t.todoId)+'" '+(t.checked?'checked':'')+'>' +
          '<span class="todo-text">'+escapeHtml(t.text)+'</span>' +
          videoHtml +
          (isAdmin ? '<button class="todo-edit" type="button" data-id="'+escapeAttr(t.todoId)+'" title="edit">✏️</button>' : '') +
          (isAdmin ? '<button class="todo-del" type="button" data-id="'+escapeAttr(t.todoId)+'" title="remove">🗑️</button>' : '') +
        '</div>' + historyHtml;
      }).join('') +
    '</div>';
  }).join('');

  wrap.querySelectorAll('.todo-item input[type="checkbox"]').forEach(el=>{
    el.addEventListener('change', async e=>{
      const todoId = e.target.dataset.id;
      const checked = e.target.checked;
      e.target.disabled = true;
      const resp = await call('toggleTodo', { todoId, checked, studentId: viewingStudentId });
      if(resp && resp.ok){
        const t = lastTodos.find(x=> x.todoId === todoId);
        if(t) t.checked = checked;
        renderTodos();
      } else {
        e.target.checked = !checked; // revert on failure
        e.target.disabled = false;
      }
    });
  });
  wrap.querySelectorAll('.todo-del').forEach(el=>{
    el.addEventListener('click', async e=>{
      const todoId = e.target.dataset.id;
      const resp = await call('removeTodo', { todoId });
      if(resp && resp.ok){
        lastTodos = lastTodos.filter(x=> x.todoId !== todoId);
        renderTodos();
      }
    });
  });
  wrap.querySelectorAll('.todo-edit').forEach(el=>{
    el.addEventListener('click', e=>{
      editingTodoId = e.target.dataset.id;
      renderTodos();
    });
  });
  wrap.querySelectorAll('.todo-edit-cancel').forEach(el=>{
    el.addEventListener('click', ()=>{ editingTodoId = null; renderTodos(); });
  });
  wrap.querySelectorAll('.todo-edit-save').forEach(el=>{
    el.addEventListener('click', async e=>{
      const form = e.target.closest('.todo-edit-form');
      const todoId = form.dataset.id;
      const text = form.querySelector('.todo-edit-text').value.trim();
      const frequency = form.querySelector('.todo-edit-freq').value;
      const videoUrl = form.querySelector('.todo-edit-video').value.trim();
      const msg = form.querySelector('.todo-edit-msg');
      if(!text){ msg.className='msg err'; msg.textContent='write the to-do first.'; return; }
      msg.className='msg'; msg.textContent='saving…';
      const resp = await call('editTodo', { todoId, text, frequency, videoUrl });
      if(resp && resp.ok){
        editingTodoId = null;
        await loadStudentData(); // re-fetch so history/grouping reflect any frequency change
      } else {
        msg.className='msg err'; msg.textContent = (resp && resp.error) || 'could not save.';
      }
    });
  });
}

function renderSessions(sessions){
  lastSessions = sessions || [];
  const wrap = document.getElementById('sessionPickerWrap');
  const sel = document.getElementById('sessionSelect');
  const detail = document.getElementById('sessionDetail');
  if(lastSessions.length === 0){
    wrap.style.display = 'none';
    detail.innerHTML = '<div class="empty-note">no sessions yet.</div>';
    return;
  }
  wrap.style.display = 'block';
  // lastSessions is already newest-first (see readSessions on the backend)
  sel.innerHTML = lastSessions.map(s=> '<option value="'+escapeAttr(s.date)+'">'+formatDateLabel(s.date)+'</option>').join('');
  if(!selectedSessionDate || !lastSessions.some(s=> s.date === selectedSessionDate)){
    selectedSessionDate = lastSessions[0].date;
  }
  sel.value = selectedSessionDate;
  sel.onchange = ()=>{ selectedSessionDate = sel.value; renderSessionDetail(); };
  renderSessionDetail();
}

function renderSessionDetail(){
  const detail = document.getElementById('sessionDetail');
  const s = lastSessions.find(x=> x.date === selectedSessionDate);
  if(!s){ detail.innerHTML = ''; return; }
  const isAdmin = session.role === 'admin';
  const blocks = [];
  const fbRows = parseRows(s.feedback);
  const hwRows = parseRows(s.homework);
  // feedback first, then homework
  if(fbRows.length){
    blocks.push('<div class="session-block"><div class="lbl">feedback</div><table class="fb-table">' +
      fbRows.map(r=> '<tr><td class="fb-topic">'+escapeHtml(r.topic)+'</td><td class="fb-notes">'+escapeHtml(r.notes)+'</td></tr>').join('') +
      '</table></div>');
  }
  if(hwRows.length){
    blocks.push('<div class="session-block"><div class="lbl">homework</div><table class="fb-table">' +
      hwRows.map(r=> '<tr><td class="fb-topic">'+escapeHtml(r.topic)+'</td><td class="fb-notes">'+escapeHtml(r.notes)+'</td></tr>').join('') +
      '</table></div>');
  }
  if(blocks.length === 0) blocks.push('<div class="empty-note">no notes for this session yet.</div>');

  // The coach's own conclusion for this session — set from the edit form,
  // read-only here for both roles.
  if(s.coachNote){
    blocks.push('<div class="session-block"><div class="lbl">conclusion</div><div class="txt">'+escapeHtml(s.coachNote)+'</div></div>');
  }

  // A student's own thoughts on this homework — separate from the coach's
  // fields above. Students can write/edit theirs; the coach only reads it.
  if(isAdmin){
    blocks.push('<div class="session-block"><div class="lbl">student\'s notes</div>' +
      (s.note ? '<div class="txt">'+escapeHtml(s.note)+'</div>' : '<div class="empty-note">no notes from the student yet.</div>') +
    '</div>');
  } else {
    blocks.push('<div class="session-block"><div class="lbl">your notes</div>' +
      '<div class="field" style="margin:4px 0 8px"><textarea id="studentNoteBox" placeholder="write your thoughts about this homework…">'+escapeHtml(s.note||'')+'</textarea></div>' +
      '<div class="row tight"><button class="btn btn-primary btn-small" id="saveStudentNoteBtn" type="button">save note</button></div>' +
      '<div class="msg" id="studentNoteMsg"></div>' +
    '</div>');
  }

  const editBtn = isAdmin ? '<button class="btn btn-ghost btn-small" type="button" onclick="editSession(\''+escapeAttr(s.date)+'\')">edit</button>' : '';
  detail.innerHTML = '<div class="card session-card"><div class="session-date"><span>'+formatDateLabel(s.date)+'</span>'+editBtn+'</div>'+blocks.join('')+'</div>';

  if(!isAdmin){
    const noteDate = s.date;
    document.getElementById('saveStudentNoteBtn').addEventListener('click', async ()=>{
      const box = document.getElementById('studentNoteBox');
      const msg = document.getElementById('studentNoteMsg');
      msg.className='msg'; msg.textContent='saving…';
      const resp = await call('saveStudentNote', { studentId: viewingStudentId, date: noteDate, note: box.value.trim() });
      if(resp && resp.ok){
        msg.className='msg ok'; msg.textContent='saved.';
        const sess = lastSessions.find(x=> x.date === noteDate);
        if(sess) sess.note = box.value.trim();
      } else {
        msg.className='msg err'; msg.textContent = (resp && resp.error) || 'could not save.';
      }
    });
  }
}

/* Feedback and homework are each stored as one text blob on the backend
   (kept simple — no sheet schema change), encoded as JSON so a blank
   line typed inside a notes box (pressing Enter twice for a paragraph
   break) can never be confused with the boundary between topic/notes
   rows. */
function serializeRows(rows){
  const clean = (rows||[])
    .filter(r=> (r.topic && r.topic.trim()) || (r.notes && r.notes.trim()))
    .map(r=> ({ topic: (r.topic||'').trim(), notes: (r.notes||'').trim() }));
  return JSON.stringify(clean);
}
function parseRows(text){
  if(!text) return [];
  const trimmed = String(text).trim();
  if(!trimmed) return [];
  if(trimmed[0] === '['){
    try{
      const rows = JSON.parse(trimmed);
      if(Array.isArray(rows)){
        return rows.filter(r=> r && (r.topic || r.notes)).map(r=> ({ topic: String(r.topic||''), notes: String(r.notes||'') }));
      }
    }catch(e){ /* not valid JSON — fall through to the legacy parser below */ }
  }
  // Legacy format from before this fix: "topic\nnotes" blocks separated
  // by a blank line. Kept so sessions saved earlier still render — but
  // this is exactly the format that broke on multi-paragraph notes, so
  // new saves always use the JSON format above instead.
  return trimmed.split(/\n\n+/).map(block=>{
    const idx = block.indexOf('\n');
    if(idx === -1) return { topic: block.trim(), notes: '' };
    return { topic: block.slice(0, idx).trim(), notes: block.slice(idx+1).trim() };
  }).filter(r=> r.topic || r.notes);
}

/* Shared topic/notes row editor, used for both the feedback and homework
   fields — rows is mutated in place, wrapId is the container to render
   into, and rerender is called after a row is added/removed. */
function renderEditRows(rows, wrapId, rerender){
  const wrap = document.getElementById(wrapId);
  wrap.innerHTML = rows.map((r,i)=>
    '<div class="fb-edit-row">' +
      '<input class="fb-topic-in" data-i="'+i+'" placeholder="topic" value="'+escapeAttr(r.topic||'')+'">' +
      '<textarea class="fb-notes-in" data-i="'+i+'" placeholder="notes">'+escapeHtml(r.notes||'')+'</textarea>' +
      '<button class="btn btn-ghost btn-small fb-remove" type="button" data-i="'+i+'">✕</button>' +
    '</div>'
  ).join('');
  wrap.querySelectorAll('.fb-topic-in').forEach(el=> el.addEventListener('input', e=>{ rows[+e.target.dataset.i].topic = e.target.value; }));
  wrap.querySelectorAll('.fb-notes-in').forEach(el=>{
    el.addEventListener('input', e=>{ rows[+e.target.dataset.i].notes = e.target.value; autoGrowTextarea(e.target); });
    autoGrowTextarea(el); // size it to whatever notes it already has
  });
  wrap.querySelectorAll('.fb-remove').forEach(el=> el.addEventListener('click', e=>{ rows.splice(+e.target.dataset.i, 1); if(!rows.length) rows.push({topic:'',notes:''}); rerender(); }));
}
function renderFbEditRows(){ renderEditRows(fbEditRows, 'fbEditRows', renderFbEditRows); }
function renderHwEditRows(){ renderEditRows(hwEditRows, 'hwEditRows', renderHwEditRows); }
document.getElementById('addFbRowBtn').addEventListener('click', ()=>{ fbEditRows.push({topic:'', notes:''}); renderFbEditRows(); });
document.getElementById('addHwRowBtn').addEventListener('click', ()=>{ hwEditRows.push({topic:'', notes:''}); renderHwEditRows(); });

/* The notes box grows to fit whatever's typed instead of cropping/scrolling it. */
function autoGrowTextarea(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function formatDateLabel(iso){
  // iso is yyyy-MM-dd — render it without any timezone shifting surprises.
  const parts = String(iso).split('-');
  if(parts.length !== 3) return escapeHtml(iso);
  const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return d.toLocaleDateString(undefined, { weekday:'short', year:'numeric', month:'short', day:'numeric' });
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }

function todayIso(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

document.getElementById('newSessionBtn').addEventListener('click', ()=>{
  editingSessionDate = null;
  document.getElementById('sessionDate').value = todayIso();
  document.getElementById('sessionMsg').textContent = '';
  // Show the card BEFORE rendering the rows — the notes boxes auto-size
  // to their content via scrollHeight, which reads as 0 while the card
  // (or any ancestor) is still display:none.
  document.getElementById('sessionFormCard').style.display = 'block';
  document.getElementById('sessionCoachNote').value = '';
  fbEditRows = [{topic:'', notes:''}];
  renderFbEditRows();
  hwEditRows = [{topic:'', notes:''}];
  renderHwEditRows();
});
document.getElementById('cancelSessionBtn').addEventListener('click', hideSessionForm);
function hideSessionForm(){
  document.getElementById('sessionFormCard').style.display = 'none';
  editingSessionDate = null;
}

/* Called from the inline "edit" button on a session card. */
function editSession(dateIso){
  const s = lastSessions.find(x=>x.date === dateIso);
  if(!s) return;
  editingSessionDate = dateIso;
  document.getElementById('sessionDate').value = dateIso;
  document.getElementById('sessionMsg').textContent = '';
  // Show the card BEFORE rendering the rows — see the comment in the
  // newSessionBtn handler above.
  document.getElementById('sessionFormCard').style.display = 'block';
  document.getElementById('sessionCoachNote').value = s.coachNote || '';
  fbEditRows = parseRows(s.feedback);
  if(!fbEditRows.length) fbEditRows = [{topic:'', notes:''}];
  renderFbEditRows();
  hwEditRows = parseRows(s.homework);
  if(!hwEditRows.length) hwEditRows = [{topic:'', notes:''}];
  renderHwEditRows();
  document.getElementById('sessionFormCard').scrollIntoView({ behavior:'smooth', block:'center' });
}

document.getElementById('saveSessionBtn').addEventListener('click', async ()=>{
  const date = document.getElementById('sessionDate').value;
  const feedback = serializeRows(fbEditRows);
  const homework = serializeRows(hwEditRows);
  const coachNote = document.getElementById('sessionCoachNote').value.trim();
  const msg = document.getElementById('sessionMsg');
  if(!date){ msg.className='msg err'; msg.textContent='pick a date.'; return; }
  msg.className='msg'; msg.textContent='saving…';
  const resp = await call('saveSession', { studentId: viewingStudentId, date, homework, feedback, coachNote });
  if(resp && resp.ok){
    msg.className='msg ok'; msg.textContent='saved.';
    selectedSessionDate = date;
    hideSessionForm();
    loadStudentData();
  } else {
    msg.className='msg err'; msg.textContent = (resp && resp.error) || 'could not save.';
  }
});
</script>
</body>
</html>
