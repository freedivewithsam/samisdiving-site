<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F2A7C0">
<title>Sam's Diving — Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sw-beige:#E8D8CC; --sw-cream:#FDEEDD; --sw-pink-lt:#FBDEE0; --sw-pink:#F8C9D9;
    --sw-mint-lt:#D5E5DE; --sw-mint:#D9E8E4; --sw-offwhite:#EDEEE6;
    --sw-blue-lt:#D3E1EA; --sw-blue:#BFD6E8; --sw-blue-dk:#8FB8DA;

    --bg:#FFF7F5; --card:#FFFFFF; --ink:#4A3740; --ink-soft:#9A8189;
    --accent:var(--sw-pink); --accent-dark:#DD7B9C; --rose:var(--sw-pink-lt); --rose-line:#F2C4D3;
    --radius:14px; --shadow:0 1px 3px rgba(74,55,64,.08), 0 6px 18px rgba(74,55,64,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Poppins",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; min-height:100vh;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:48px 20px 60px;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:.2px;
    color:var(--ink);
  }
  p.sub{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 32px;
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  a.tile{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--rose-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    transition:background .15s ease, transform .1s ease, border-color .15s ease;
  }
  a.tile:active{ transform:scale(0.98); }
  @media (hover:hover){
    a.tile:hover{ background:var(--rose); border-color:var(--accent-dark); }
  }
  .icon{
    width:40px; height:40px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    background:var(--sw-mint-lt);
    flex-shrink:0;
  }
  .label{ flex:1; min-width:0; }
  .label .name{ font-size:16px; font-weight:600; }
  .label .desc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .arrow{ color:var(--accent-dark); font-size:18px; }
  footer{
    text-align:center;
    margin-top:40px;
    color:var(--ink-soft);
    font-size:12px;
  }
</style>
</head>
<body>
<div id="__passcodeGate" style="position:fixed;inset:0;z-index:999999;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">
  <form id="__gateForm" style="background:#fff;padding:32px 28px;border-radius:14px;width:min(90vw,320px);box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;">
    <div style="font-size:15px;color:#333;margin-bottom:14px;">Enter passcode</div>
    <input id="__gateInput" type="password" inputmode="numeric" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px 12px;font-size:18px;letter-spacing:2px;text-align:center;border:1px solid #ccc;border-radius:8px;outline:none;" autofocus>
    <div id="__gateError" style="color:#c0392b;font-size:13px;height:18px;margin-top:8px;"></div>
    <button type="submit" style="margin-top:6px;width:100%;padding:10px;font-size:15px;border:none;border-radius:8px;background:#333;color:#fff;cursor:pointer;">Unlock</button>
  </form>
</div>
<script>
(function(){
  var HASH = "6c94e35ccc352d4e9ef0b99562cff995a5741ce8de8ad11b568892934daee366";
  var SESSION_KEY = "__gateOk_" + HASH.slice(0,8);
  async function sha256(text){
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function unlock(){
    var g = document.getElementById("__passcodeGate");
    if (g) g.remove();
  }
  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    unlock();
  } else {
    document.getElementById("__gateForm").addEventListener("submit", async function(e){
      e.preventDefault();
      var val = document.getElementById("__gateInput").value;
      var h = await sha256(val);
      if (h === HASH) {
        sessionStorage.setItem(SESSION_KEY, "1");
        unlock();
      } else {
        document.getElementById("__gateError").textContent = "Incorrect passcode";
        document.getElementById("__gateInput").value = "";
        document.getElementById("__gateInput").focus();
      }
    });
  }
})();
</script>

  <div class="wrap">
    <h1>Sam's Diving — Tools</h1>
    <p class="sub">Internal navigation. Not linked from the main site.</p>
    <div class="grid">
      <a class="tile" href="/freestep">
        <div class="icon">📦</div>
        <div class="label">
          <div class="name">Freestep</div>
          <div class="desc">Stock &amp; sales tracker</div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="tile" href="/samsamsam">
        <div class="icon">📅</div>
        <div class="label">
          <div class="name">Samsamsam</div>
          <div class="desc">Students, calendar &amp; payments</div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="tile" href="/dnf">
        <div class="icon">🫁</div>
        <div class="label">
          <div class="name">DNF</div>
          <div class="desc">Dynamic no-fins tool</div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="tile" href="/dnfonline">
        <div class="icon">🌐</div>
        <div class="label">
          <div class="name">DNF Online</div>
          <div class="desc">Online DNF tool</div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="tile" href="/calculator">
        <div class="icon">🧮</div>
        <div class="label">
          <div class="name">Calculator</div>
          <div class="desc">Diving calculator</div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>
    <footer>samisdiving.com/nav</footer>
  </div>
</body>
</html>
