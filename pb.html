<style>
  :root{
    --sw-gold:#AEC3F5; --bg:#FFFDF7; --card:#FFFFFF; --ink:#332F3D; --ink-soft:#8B86A0;
    --accent-dark:#5B7FE0; --rose-line:#F4C4E8;
    --radius:14px; --shadow:0 1px 3px rgba(51,47,61,.08), 0 6px 18px rgba(51,47,61,.06);
  }
  *{box-sizing:border-box; min-width:0}
  html,body{margin:0;padding:0;overflow-x:hidden;overscroll-behavior-y:contain;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Poppins",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; min-height:100vh;
  }
  button{touch-action:manipulation}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px}
  header.app{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .brand h1{font-family:"Poppins",serif;font-weight:600;font-size:26px;margin:0;letter-spacing:.2px}
  .brand p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}

  .header-actions{display:flex;align-items:center;gap:8px;flex:none}
  .btn{border:none;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:none}
  .btn-calc{background:var(--sw-gold);color:var(--ink);border:1px solid var(--accent-dark)}
  .btn-calc:hover{background:var(--accent-dark);color:#fff}
  .btn-nav{background:#fff;color:var(--ink-soft);border:1px solid var(--rose-line);text-decoration:none;display:inline-flex;align-items:center}
  .btn-nav:hover{background:var(--rose-line);color:var(--ink)}
  .btn-cart{background:#fff;color:var(--ink);border:1px solid var(--accent-dark);display:inline-flex;align-items:center;gap:6px}
  .btn-cart:hover{background:var(--sw-gold);color:var(--ink)}
  .cart-badge{background:var(--accent-dark);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}

  .cart-add-btn{border:1.5px solid var(--rose-line);background:#fff;color:var(--accent-dark);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex:none}
  .cart-add-btn:hover{background:var(--sw-gold);border-color:var(--accent-dark);color:var(--ink)}
  .cart-lines{display:flex;flex-direction:column;gap:14px}
  .cart-line{border:1px solid var(--rose-line);border-radius:12px;padding:10px 12px;background:#FFF8FA}
  .cart-line-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cart-line-name{font-weight:600;font-size:14px}
  .cart-remove{background:transparent;border:none;font-size:18px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:2px 6px;border-radius:8px}
  .cart-remove:hover{background:var(--rose,#FBC9CE);color:#b91c1c}
  .cart-line-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
  .cart-qty{display:flex;align-items:center;gap:8px;font-weight:600}
  .cart-qty button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rose-line);background:#fff;color:var(--accent-dark);font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
  .cart-qty button:hover{background:var(--sw-gold);border-color:var(--accent-dark)}
  .cart-line-price{font-size:12.5px;color:var(--ink-soft)}
  .cart-addons{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .cart-addon{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer}
  .cart-addon input{cursor:pointer}
  .cart-line-subtotal{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:right}
  .cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--rose-line);font-size:15px}
  .cart-total-row strong{font-size:17px;color:var(--accent-dark)}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .card h3{margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:right;padding:6px 8px;color:var(--ink-soft);font-size:12px;text-transform:uppercase}
  th:first-child{text-align:left}
  .formula-card{background:#FFF8FA}
  .formula-card h3{font-size:15px}
  .formula-edit-hint{font-weight:400;font-size:12px;color:var(--ink-soft)}
  .formula-grid{display:flex;flex-direction:column;gap:12px}
  .formula-row{display:grid;grid-template-columns:150px auto;gap:4px 14px;align-items:baseline}
  .formula-label{font-weight:600;font-size:13px;color:var(--ink)}
  .formula-row code{grid-column:2;background:#fff;border:1px solid var(--rose-line);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--accent-dark);width:fit-content}
  .formula-note{grid-column:2;font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:14px;margin-top:2px}
  .formula-note label{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .formula-note input[type=number]{width:90px;padding:5px 8px;border:1.5px solid var(--rose-line);border-radius:8px;font-family:inherit;font-size:13px !important;color:var(--ink);background:#fff}
  .formula-note input[type=number]:focus{outline:none;border-color:var(--accent-dark)}
  .margin-formula-input{grid-column:2;width:100%;max-width:340px;padding:6px 10px;border:1.5px solid var(--rose-line);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px !important;color:var(--accent-dark);background:#fff}
  .margin-formula-input:focus{outline:none;border-color:var(--accent-dark)}
  .formula-note code{background:#fff;border:1px solid var(--rose-line);border-radius:6px;font-size:11.5px}
  .chip-row{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
  .chip{border:1.5px solid var(--rose-line);background:#fff;border-radius:8px;padding:4px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;cursor:pointer;line-height:1.2}
  .chip-var{color:var(--accent-dark);font-weight:600}
  .chip-var:hover{background:var(--sw-gold,#AEC3F5);border-color:var(--accent-dark);color:var(--ink)}
  .chip-op{color:var(--ink-soft);padding:4px 12px}
  .chip-op:hover{background:var(--rose,#FBC9CE);color:var(--ink)}
  .chip-sep{width:1px;align-self:stretch;background:var(--rose-line);margin:0 2px}
  .chip-toolbar{background:#FFF8FA;border:1px solid var(--rose-line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .chip-toolbar-hint{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .chip-row-toolbar{grid-column:auto}

  dialog{border:none;border-radius:0;padding:0;background:transparent;max-width:none;width:100%}
  dialog::backdrop{background:rgba(62,58,46,.4)}
  #calcDialog, #cartDialog{position:fixed;inset:0;margin:0;align-items:flex-end;justify-content:center;max-height:none;height:100%;background:transparent}
  #calcDialog[open], #cartDialog[open]{display:flex}
  .modal-in{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;max-height:88vh;overflow-y:auto;box-shadow:0 -6px 24px rgba(0,0,0,.15)}
  @media (min-width:640px){ #calcDialog, #cartDialog{align-items:center} .modal-in{border-radius:20px;margin-top:0} }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .modal-head h3{margin:0;font-size:16px}
  .modal-close{background:transparent;border:none;font-size:20px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 6px;border-radius:8px}
  .modal-close:hover{background:var(--rose,#FBC9CE);color:var(--ink)}
  .modal-in .formula-card{background:transparent;box-shadow:none;padding:0;margin:0}
  .modal-footer{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--rose-line)}
  .save-status{font-size:12.5px;color:var(--ok,#2FA36B);opacity:0;transition:opacity .2s}
  .save-status.show{opacity:1}

  /* Below 700px the price table stops trying to be a table — seven squeezed
     columns is what was hard to read on a phone — and each row becomes its
     own stacked card instead: fin name up top, then one clearly labelled
     price per line. */
  @media (max-width:700px){
    .wrap{padding:16px 12px 60px}
    .brand h1{font-size:22px}
    .card{padding:12px}

    table, thead, tbody, tr, td{display:block;width:100%}
    table{border-spacing:0}
    thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    tbody tr{
      border:1px solid var(--rose-line);border-radius:14px;
      padding:12px 14px;margin-bottom:12px;background:#fff;
    }
    tbody tr td{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 0;border-bottom:1px dashed var(--rose-line);
      font-size:15px;text-align:right;
    }
    tbody tr td:last-child{border-bottom:none;padding-bottom:0}
    tbody tr td::before{
      content:attr(data-label);font-size:11.5px;font-weight:700;
      text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);
      text-align:left;flex:none;
    }
    /* the fin-name row already carries its own label (the name) plus the
       cart button, so it gets no data-label prefix and a heavier rule under
       it to read as the card's header */
    tbody tr td:first-child{
      padding-bottom:10px;margin-bottom:2px;
      border-bottom:1.5px solid var(--rose-line);
    }
    tbody tr td:first-child::before{content:none}
    tbody tr td:first-child > div{width:100%}
    tbody tr td:first-child span{font-size:15.5px;font-weight:600}
    .cart-add-btn{padding:5px 12px;font-size:12.5px}

    header.app{flex-wrap:wrap}
    .header-actions{flex-wrap:wrap;row-gap:8px;width:100%}
    .btn{padding:8px 12px;font-size:12.5px}
    #pbSyncStatus{text-align:left !important}

    /* Calculation popup: the formula grid is normally a fixed label column
       plus a wide input column — on a phone that squeezed the formula box
       into a sliver (or pushed it into a column that no longer existed),
       cutting it off. Stack label above field instead, and let the field
       use the full width. */
    .formula-row{grid-template-columns:1fr}
    .formula-row code{grid-column:1}
    .formula-note{grid-column:1}
    .margin-formula-input{grid-column:1;max-width:none;font-size:14px !important}
    .chip-row{grid-column:1}
    .modal-in{padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
  }
  input, select, textarea{ font-size:16px !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="brand">
      <h1>Prussian Blue Fins</h1>
      <p>Import cost &amp; margin calculator</p>
    </div>
    <div class="header-actions">
      <a class="btn btn-nav" href="https://samisdiving.com/nav">&larr; Nav</a>
      <button type="button" class="btn btn-nav" id="pbSyncBtn" title="sync these numbers across devices via Google Sheet">Sync: On &#9729;</button>

<script>
// ---- PB (Prussian Blue Fins import calculator) ----------------------------
// Catalog captured from the homepage sliders at prussianbluefins.com
// (Carbon Fiber Fins / Fiberglass Fins / Fiberglass Short Fins) on 2026-09-01.
// Prices are the site's already-discounted NT$ "sale" price. This is only
// what's shown on the homepage — the site has further category pages
// (Monofins, Foot Pockets, Exclusive Edition, made-to-order series, etc.)
// not included here.
// Collapsed to one row per price point — the site has many colorways of the
// same blade at the same price, so they're combined here instead of listed
// individually (kept a full one-per-colorway history in git if ever needed).
// box: which PB_BOX_TYPES key this fin ships in — travel fins & short fins
// use "ts", PB-50 uses "pb50", everything else uses "other".
// orig: the site's crossed-out ORIGINAL NT$ price (before the site's own
// markdown). ntd: the site's already-discounted SALE price — this is what
// "Your cost" is based on (further 40% off). "Sell price" is based on orig.
const PB_CATALOG = [
  {cat:'Carbon Fiber Fins', name:'PB-X1 Carbon Fiber Fins', orig:15300, ntd:15000, box:'other'},
  {cat:'Carbon Fiber Fins', name:'PB-75 Carbon Fiber Fins', orig:14500, ntd:14200, box:'other'},
  {cat:'Carbon Fiber Fins', name:'PB-60 Carbon Fiber Travel Fins', orig:12300, ntd:12000, box:'ts'},
  {cat:'Carbon Fiber Fins', name:'PB-50 Carbon Fiber Scuba Diving Fins', orig:10300, ntd:10000, box:'pb50'},
  {cat:'Carbon Fiber Fins', name:'PB-81 Carbon Fiber Fins', orig:13000, ntd:12700, box:'other'},
  {cat:'Carbon Fiber Fins', name:'Painted Carbon Fiber Fins', orig:16800, ntd:16500, box:'other'},
  {cat:'Carbon Fiber Fins', name:'Painted Carbon Fiber Travel Fins', orig:14800, ntd:14500, box:'ts'},
  {cat:'Fiberglass Fins', name:'Fiberglass Fins', orig:10300, ntd:10000, box:'other'},
  {cat:'Fiberglass Short Fins', name:'Fiberglass Short Fins', orig:8600, ntd:8300, box:'ts'},
];

// ---- editable settings, persisted so tweaks survive a refresh -------------
// storage that survives sandboxed iframes where localStorage throws
const PB_LS_KEY = 'pb-fins-settings-v1';
const pbStorage = (() => {
  try {
    localStorage.setItem('__t','1'); localStorage.removeItem('__t');
    return { get: () => localStorage.getItem(PB_LS_KEY), set: v => localStorage.setItem(PB_LS_KEY, v) };
  } catch(e) {
    let mem = null;
    return { get: () => mem, set: v => { mem = v; } };
  }
})();

// One box ships this many fins — used to split the shipping formula's box
// total across each fin (see the default shippingFormula below).
const PB_FINS_PER_BOX = 3;

// Defaults, used the first time (or whenever a saved value is missing/invalid).
// rate: TWD -> IDR. Back-calculated from Rp 8,618,544.64 shown for the
//   NT$15,300 PB-X1 on the site itself (which localizes currency by visitor
//   region). Re-derive it the same way if the site's rate drifts.
// shipRatePerKg: cost per volumetric kg, in IDR.
// boxDims: length/width/height (cm) of the (single) box every fin ships in.
// costFormula / websiteSellFormula / shippingFormula / marginFormula:
// editable expressions — see PB_FORMULAS below for each one's available
// variables. Margin % is derived from margin, not separately editable.
const PB_DEFAULTS = {
  rate: 570,
  shipRatePerKg: 320000,
  boxDims: { l: 0, w: 0, h: 0 },
  costFormula: '(ntd * 0.6) * rate',
  websiteSellFormula: '(orig * rate) * 0.9',
  shippingFormula: '((l * w * h / 5000) * rate) / fins',
  marginFormula: 'websiteSell - cost',
};

// Which variables each formula is allowed to use, and how to label them in
// the popup. Kept in one place so the validator, the evaluator and the UI
// hint all stay in sync.
// Computed in this order per fin: shipping (shared, once) -> cost ->
// website sell price -> margin.
// Each formula can use any value already computed by the time it runs, not
// just its "own" variables — e.g. the cost formula can factor in shipping.
const PB_FORMULAS = {
  costFormula:        { label: 'Your cost (IDR)',       vars: ['ntd', 'orig', 'rate', 'shipping'] },
  websiteSellFormula: { label: 'Website sell price',    vars: ['ntd', 'orig', 'rate', 'shipping', 'cost'] },
  shippingFormula:    { label: 'Shipping',              vars: ['l', 'w', 'h', 'rate', 'fins'] },
  marginFormula:       { label: 'Margin',                vars: ['ntd', 'orig', 'rate', 'shipping', 'cost', 'websiteSell'] },
};

let pbSettings;
try { pbSettings = Object.assign({}, PB_DEFAULTS, JSON.parse(pbStorage.get())); } catch(e){ pbSettings = Object.assign({}, PB_DEFAULTS); }
if(typeof pbSettings.rate !== 'number' || isNaN(pbSettings.rate)) pbSettings.rate = PB_DEFAULTS.rate;
if(typeof pbSettings.shipRatePerKg !== 'number' || isNaN(pbSettings.shipRatePerKg)) pbSettings.shipRatePerKg = PB_DEFAULTS.shipRatePerKg;
// Migrate a save from before "sell price" was split into website / base /
// end-selling: reuse the old sell formula as the new website-sell formula,
// and rewrite "sellPrice" references in an old margin formula to "endSelling".
if(typeof pbSettings.sellFormula === 'string' && typeof pbSettings.websiteSellFormula !== 'string'){
  pbSettings.websiteSellFormula = pbSettings.sellFormula;
  delete pbSettings.sellFormula;
  if(typeof pbSettings.marginFormula === 'string'){
    pbSettings.marginFormula = pbSettings.marginFormula.replace(/\bsellPrice\b/g, 'endSelling');
  }
}
// Migrate a save from before "end selling price" was removed: it used to be
// sellBase + shipping, so rewrite any old margin formula's "endSelling"
// references to the equivalent "(sellBase + shipping)" expression.
if(typeof pbSettings.marginFormula === 'string' && /\bendSelling\b/.test(pbSettings.marginFormula)){
  pbSettings.marginFormula = pbSettings.marginFormula.replace(/\bendSelling\b/g, '(sellBase + shipping)');
}
delete pbSettings.endSellingFormula;
// Migrate a save from before "my base price" was removed: it defaulted to
// websiteSell, so rewrite any old margin formula's "sellBase" references to
// "websiteSell" directly.
if(typeof pbSettings.marginFormula === 'string' && /\bsellBase\b/.test(pbSettings.marginFormula)){
  pbSettings.marginFormula = pbSettings.marginFormula.replace(/\bsellBase\b/g, 'websiteSell');
}
delete pbSettings.sellBaseFormula;
Object.keys(PB_FORMULAS).forEach(key => {
  if(typeof pbSettings[key] !== 'string' || !pbSettings[key].trim()) pbSettings[key] = PB_DEFAULTS[key];
});
{
  const d = pbSettings.boxDims;
  pbSettings.boxDims = {
    l: (d && typeof d.l === 'number' && !isNaN(d.l)) ? d.l : 0,
    w: (d && typeof d.w === 'number' && !isNaN(d.w)) ? d.w : 0,
    h: (d && typeof d.h === 'number' && !isNaN(d.h)) ? d.h : 0,
  };
}

function savePbSettings(){ pbStorage.set(JSON.stringify(pbSettings)); scheduleCloudSync(); }

// ---- cart -------------------------------------------------------------
// Per-device (localStorage only, not synced to the Google Sheet — a cart is
// a per-visitor shopping list, not a shared setting). Keyed by fin name;
// prices are never frozen into the cart, they're recomputed live from
// PB_CATALOG + the current formulas every time the cart is rendered, so
// editing a formula updates the cart total too.
const PB_CART_KEY = 'pb-fins-cart-v1';
const pbCartStorage = (() => {
  try {
    localStorage.setItem('__t','1'); localStorage.removeItem('__t');
    return { get: () => localStorage.getItem(PB_CART_KEY), set: v => localStorage.setItem(PB_CART_KEY, v) };
  } catch(e) {
    let mem = null;
    return { get: () => mem, set: v => { mem = v; } };
  }
})();

// Optional add-ons, priced in NT$ and converted to IDR at the currently-set
// TWD->IDR rate (same rate used everywhere else on the page).
const PB_ADDONS = [
  { id: 'silicone', name: 'Silicone Paddings', ntd: 300 },
];
function addonPriceIDR(addon){
  const rate = (pbSettings && typeof pbSettings.rate === 'number' && pbSettings.rate > 0) ? pbSettings.rate : PB_DEFAULTS.rate;
  return addon.ntd * rate;
}

let pbCart;
try { pbCart = JSON.parse(pbCartStorage.get()) || {}; } catch(e){ pbCart = {}; }
if(typeof pbCart !== 'object' || pbCart === null || Array.isArray(pbCart)) pbCart = {};

function saveCart(){ pbCartStorage.set(JSON.stringify(pbCart)); }
function cartCount(){ return Object.values(pbCart).reduce((sum, item) => sum + (item.qty || 0), 0); }

function addToCart(name){
  if(!pbCart[name]) pbCart[name] = { qty: 0, addons: {} };
  pbCart[name].qty += 1;
  saveCart();
  renderAndBindPB();
}
function removeFromCart(name){
  delete pbCart[name];
  saveCart();
  renderAndBindPB();
}
function setCartQty(name, qty){
  if(!pbCart[name]) return;
  if(qty <= 0){ delete pbCart[name]; }
  else { pbCart[name].qty = qty; }
  saveCart();
  renderAndBindPB();
}
function toggleCartAddon(name, addonId){
  if(!pbCart[name]) return;
  if(!pbCart[name].addons) pbCart[name].addons = {};
  pbCart[name].addons[addonId] = !pbCart[name].addons[addonId];
  saveCart();
  renderAndBindPB();
}

function computeCartTotals(){
  const shipResult = computeShipFee();
  const shipFee = shipResult.ok ? shipResult.value : NaN;
  const lines = Object.keys(pbCart).map(name => {
    const p = PB_CATALOG.find(x => x.name === name);
    if(!p) return null;
    const entry = pbCart[name];
    const pricing = computeProductPricing(p, shipFee);
    const unitPrice = pricing.websiteSell;
    const addonsChosen = PB_ADDONS.filter(a => entry.addons && entry.addons[a.id]);
    const addonUnitTotal = addonsChosen.reduce((sum, a) => sum + addonPriceIDR(a), 0);
    const ok = pricing.websiteSellResult.ok;
    const lineTotal = ok ? (unitPrice + addonUnitTotal) * entry.qty : NaN;
    return { name, qty: entry.qty, unitPrice, addonsChosen, addonUnitTotal, lineTotal, ok };
  }).filter(Boolean);
  const total = lines.reduce((sum, l) => sum + (isNaN(l.lineTotal) ? 0 : l.lineTotal), 0);
  return { lines, total };
}

function renderCartBody(){
  const { lines, total } = computeCartTotals();
  if(!lines.length){
    return '<p style="color:var(--ink-soft);font-size:13.5px;margin:4px 0 0">Your cart is empty — tap "+ Cart" next to a fin to add it.</p>';
  }
  const linesHtml = lines.map(l => `
    <div class="cart-line">
      <div class="cart-line-head">
        <span class="cart-line-name">${l.name}</span>
        <button type="button" class="cart-remove" data-remove-cart="${l.name.replace(/"/g, '&quot;')}" aria-label="Remove">&times;</button>
      </div>
      <div class="cart-line-row">
        <div class="cart-qty">
          <button type="button" data-qty-cart="${l.name.replace(/"/g, '&quot;')}" data-delta="-1" aria-label="Decrease">&minus;</button>
          <span>${l.qty}</span>
          <button type="button" data-qty-cart="${l.name.replace(/"/g, '&quot;')}" data-delta="1" aria-label="Increase">+</button>
        </div>
        <div class="cart-line-price">${l.ok ? formatIDR(l.unitPrice) + ' each' : '<span style="color:#b91c1c">price error</span>'}</div>
      </div>
      <div class="cart-addons">
        ${PB_ADDONS.map(a => `
          <label class="cart-addon">
            <input type="checkbox" data-addon-cart="${l.name.replace(/"/g, '&quot;')}" data-addon-id="${a.id}" ${l.addonsChosen.some(x => x.id === a.id) ? 'checked' : ''}>
            ${a.name} (+NT$${a.ntd} &rarr; ${formatIDR(addonPriceIDR(a))} each)
          </label>`).join('')}
      </div>
      <div class="cart-line-subtotal">Subtotal: ${l.ok ? formatIDR(l.lineTotal) : '<span style="color:#b91c1c">error</span>'}</div>
    </div>`).join('');
  return `
    <div class="cart-lines">${linesHtml}</div>
    <div class="cart-total-row"><span>Total (website price)</span><strong>${formatIDR(total)}</strong></div>`;
}

function bindCartEvents(container){
  container.querySelectorAll('[data-add-cart]').forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.addCart));
  });
  container.querySelectorAll('[data-remove-cart]').forEach(btn => {
    btn.addEventListener('click', () => removeFromCart(btn.dataset.removeCart));
  });
  container.querySelectorAll('[data-qty-cart]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.qtyCart;
      const delta = parseInt(btn.dataset.delta, 10);
      const current = pbCart[name] ? pbCart[name].qty : 0;
      setCartQty(name, current + delta);
    });
  });
  container.querySelectorAll('[data-addon-cart]').forEach(chk => {
    chk.addEventListener('change', () => toggleCartAddon(chk.dataset.addonCart, chk.dataset.addonId));
  });
}

// ---- cross-device sync (optional) -----------------------------------------
// localStorage alone only persists on the one browser/device that touched
// it — fine for a quick refresh, useless once this page is hosted on GitHub
// Pages and opened from a phone, a laptop, or after a redeploy. To carry
// numbers across devices this pushes/pulls pbSettings to a small free
// backend: a Google Apps Script Web App backed by a Google Sheet. It's just
// a plain fetch() to a URL, so it works from a static GitHub Pages site (or
// any plain .html file) with no server of your own.
//
// Setup (one-time, ~2 minutes):
//   1. Go to script.google.com -> New project.
//   2. Paste the Code.gs from the setup note (ask for it) and Deploy > New
//      deployment > type "Web app", access "Anyone".
//   3. Copy the resulting URL and put it in PB_SHEET_URL below.
// Baked-in endpoint for this page — every visitor syncs to the same Google
// Sheet backend by default. The "Sync ☁" button just toggles it on/off per
// browser (via localStorage); it never prompts for a URL.
const PB_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyqFP5MzFZEW-NmLaYnJEFJLgApmufg0P2WXlt5V1FsURvrWjhqBk4x5Mx3rOAD2B9UBA/exec';
const PB_SHEET_URL_KEY = 'pb_sheet_sync_enabled';
let pbCloudAvailable = false;
let pbCloudSyncTimer = null;
let pbLastSyncedJson = null;

function pbSyncEnabled(){
  try {
    const flag = localStorage.getItem(PB_SHEET_URL_KEY);
    return flag !== 'off'; // on by default
  } catch(e){ return true; }
}
function pbSheetEndpoint(){
  return pbSyncEnabled() ? PB_SHEET_URL : null;
}
function pbSetSyncEnabled(on){
  try { localStorage.setItem(PB_SHEET_URL_KEY, on ? 'on' : 'off'); } catch(e){ /* ignore */ }
}

function scheduleCloudSync(immediate){
  if(!pbSheetEndpoint()) return;
  if(pbCloudSyncTimer) clearTimeout(pbCloudSyncTimer);
  pbCloudSyncTimer = setTimeout(doCloudSync, immediate ? 50 : 1200);
}

function doCloudSync(){
  pbCloudSyncTimer = null;
  const url = pbSheetEndpoint();
  if(!url) return;
  const json = JSON.stringify(pbSettings);
  if(json === pbLastSyncedJson) return;
  // text/plain avoids a CORS preflight, which a default Apps Script Web App
  // deployment doesn't handle.
  fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: json })
    .then(r => { if(!r.ok) throw new Error('save failed'); return r.json(); })
    .then(() => { pbLastSyncedJson = json; pbCloudAvailable = true; updatePbSyncStatus(); })
    .catch(() => { scheduleCloudSync(); });
}

function pullCloudState(){
  const url = pbSheetEndpoint();
  if(!url) return;
  fetch(url, { cache: 'no-store' }).then(r => {
    if(!r.ok) throw new Error('fetch failed');
    return r.json();
  }).then(data => {
    if(data && typeof data === 'object' && Object.keys(data).length){
      pbSettings = Object.assign({}, PB_DEFAULTS, pbSettings, data);
      Object.keys(PB_FORMULAS).forEach(key => {
        if(typeof pbSettings[key] !== 'string' || !pbSettings[key].trim()) pbSettings[key] = PB_DEFAULTS[key];
      });
      pbLastSyncedJson = JSON.stringify(pbSettings);
      pbStorage.set(pbLastSyncedJson);
      pbCloudAvailable = true;
      updatePbSyncStatus();
      renderAndBindPB();
    } else {
      // sheet has nothing saved yet — push what we have now
      pbCloudAvailable = true;
      updatePbSyncStatus();
      scheduleCloudSync(true);
    }
  }).catch(() => {
    pbCloudAvailable = false;
    updatePbSyncStatus();
  });
}

function updatePbSyncStatus(){
  const el = document.getElementById('pbSyncStatus');
  const btn = document.getElementById('pbSyncBtn');
  const on = pbSyncEnabled();
  if(el) el.textContent = on ? (pbCloudAvailable ? 'Synced via Google Sheet' : 'Sync on — connecting…') : 'Sync off — saved on this device only';
  if(btn) btn.textContent = on ? 'Sync: On ☁' : 'Sync: Off';
}

function togglePbCloudSync(){
  const turningOn = !pbSyncEnabled();
  pbSetSyncEnabled(turningOn);
  pbCloudAvailable = false;
  updatePbSyncStatus();
  if(turningOn) pullCloudState();
}

// Safely evaluate a user-typed formula. Only digits, the named variables for
// that field, arithmetic operators, parentheses and decimal points are
// allowed — anything else (an unknown name, semicolons, function calls,
// etc.) is rejected before it ever reaches Function(), so a field can't be
// used to run arbitrary script.
// Expands currency-literal tokens like "NTD1500" or "ntd1500.5" into a plain
// numeric expression using the current TWD->IDR rate, e.g. "(1500*570)".
// Safe against colliding with the "ntd" formula variable because that
// variable name is never immediately followed by a digit in normal usage.
function expandCurrencyLiterals(formula){
  const twdRate = (pbSettings && typeof pbSettings.rate === 'number' && pbSettings.rate > 0) ? pbSettings.rate : PB_DEFAULTS.rate;
  return formula.replace(/ntd\s*([0-9]+(?:\.[0-9]+)?)/gi, (_, num) => `(${num}*${twdRate})`);
}

function evalFormula(formulaKey, formula, values){
  const varNames = PB_FORMULAS[formulaKey].vars;
  const expanded = expandCurrencyLiterals(formula);
  const stripped = expanded.replace(new RegExp(varNames.join('|'), 'g'), '');
  if(/[^0-9+\-*/().\s]/.test(stripped)) {
    return { ok: false, error: `Only ${varNames.join(', ')}, numbers, NTD&lt;amount&gt; and + - * / ( ) are allowed.` };
  }
  try {
    const fn = new Function(...varNames, `"use strict"; return (${expanded});`);
    const result = fn(...varNames.map(v => values[v]));
    if(typeof result !== 'number' || !isFinite(result)) return { ok: false, error: 'Formula did not produce a number.' };
    return { ok: true, value: result };
  } catch(e){
    return { ok: false, error: 'Invalid formula.' };
  }
}

function formatNTD(n){
  return 'NT$' + Math.round(n||0).toLocaleString('en-US');
}
function formatIDR(n){
  return 'IDR ' + Math.round(n||0).toLocaleString('id-ID');
}

// ---- shared pricing (used by both the table and the cart) -----------------
function computeShipFee(){
  const { shipRatePerKg, boxDims, shippingFormula } = pbSettings;
  return evalFormula('shippingFormula', shippingFormula, {
    l: boxDims.l, w: boxDims.w, h: boxDims.h, rate: shipRatePerKg, fins: PB_FINS_PER_BOX,
  });
}

// "orig" here is the site's already-discounted sale price (ntd), not the
// crossed-out original — e.g. PB-X1 uses NT$15,000, not NT$15,300.
// Computed in order — cost, then website sell price — so websiteSellFormula
// can factor in cost (and shipping) if it references them.
function computeProductPricing(p, shipFee){
  const { rate, costFormula, websiteSellFormula } = pbSettings;
  const costResult = evalFormula('costFormula', costFormula, { ntd: p.ntd, orig: p.ntd, rate, shipping: shipFee });
  const cost = costResult.ok ? costResult.value : NaN;
  const websiteSellResult = costResult.ok
    ? evalFormula('websiteSellFormula', websiteSellFormula, { ntd: p.ntd, orig: p.ntd, rate, shipping: shipFee, cost })
    : { ok: false };
  return { costResult, cost, websiteSellResult, websiteSell: websiteSellResult.ok ? websiteSellResult.value : NaN };
}

function renderTables(){
  const { rate, marginFormula } = pbSettings;

  const shipResult = computeShipFee();
  const shipFee = shipResult.ok ? shipResult.value : NaN;
  const cats = [...new Set(PB_CATALOG.map(p => p.cat))];

  function cell(result, formatter){
    return result.ok ? formatter(result.value) : '<span style="color:#b91c1c">error</span>';
  }

  function row(p){
    const { costResult, cost, websiteSellResult, websiteSell } = computeProductPricing(p, shipFee);
    const cartQty = pbCart[p.name] ? pbCart[p.name].qty : 0;

    const marginResult = (costResult.ok && websiteSellResult.ok && shipResult.ok)
      ? evalFormula('marginFormula', marginFormula, { ntd: p.ntd, orig: p.ntd, rate, shipping: shipFee, cost, websiteSell })
      : { ok: false };
    const margin = marginResult.ok ? marginResult.value : NaN;
    const marginColor = m => (isNaN(m) ? 'var(--ink-soft)' : (m < 0 ? '#b91c1c' : 'inherit'));
    const marginPct = (marginResult.ok && websiteSellResult.ok && websiteSell !== 0) ? (margin / websiteSell) * 100 : NaN;
    const marginPctText = isNaN(marginPct) ? '<span style="color:#b91c1c">error</span>' : `${marginPct.toFixed(1)}%`;
    return `
      <tr>
        <td style="padding:6px 8px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span>${p.name}</span>
            <button type="button" class="cart-add-btn" data-add-cart="${p.name.replace(/"/g, '&quot;')}">${cartQty > 0 ? `&#128722; ${cartQty}` : '+ Cart'}</button>
          </div>
        </td>
        <td data-label="Site price" style="text-align:right;padding:6px 8px;color:var(--ink-soft)">${formatNTD(p.ntd)}</td>
        <td data-label="Your cost" style="text-align:right;padding:6px 8px;font-weight:600">${cell(costResult, formatIDR)}</td>
        <td data-label="Website sell" style="text-align:right;padding:6px 8px;font-weight:600">${cell(websiteSellResult, formatIDR)}</td>
        <td data-label="Shipping" style="text-align:right;padding:6px 8px;color:var(--ink-soft)">${cell(shipResult, formatIDR)}</td>
        <td data-label="Margin" style="text-align:right;padding:6px 8px;font-weight:600;color:${marginColor(margin)}">${marginResult.ok ? formatIDR(margin) : '<span style="color:#b91c1c">error</span>'}</td>
        <td data-label="Margin %" style="text-align:right;padding:6px 8px;font-weight:600;color:${marginColor(margin)}">${marginPctText}</td>
      </tr>`;
  }

  const sections = cats.map(cat => {
    const items = PB_CATALOG.filter(p => p.cat === cat);
    return `
      <div class="card">
        <h3>${cat}</h3>
        <div style="overflow-x:auto">
          <table>
            <thead><tr>
              <th style="text-align:left">Fin</th>
              <th>Site price</th>
              <th>Your cost</th>
              <th>Website sell price</th>
              <th>Shipping</th>
              <th>Margin</th>
              <th>Margin %</th>
            </tr></thead>
            <tbody>${items.map(row).join('')}</tbody>
          </table>
        </div>
      </div>`;
  }).join('');

  return sections;
}

const PB_OPERATOR_CHIPS = ['+', '-', '×', '/', '(', ')'];
// The multiplication chip shows as × but inserts a real * into the formula.
function chipInsertText(chip){ return chip === '×' ? '*' : chip; }

// Which formula field a chip click inserts into: whichever formula field the
// user last focused, so the variable/operator toolbar can live once at the
// top of the popup instead of being repeated under every field. Falls back
// to the first formula field until something has been focused.
let pbLastFocusedInputId = null;

function formulaRowHtml(key, sampleValues, extraNoteHtml){
  const { label } = PB_FORMULAS[key];
  const formula = pbSettings[key];
  const check = evalFormula(key, formula, sampleValues);
  const inputId = `formula-input-${key}`;
  return `
      <div class="formula-row">
        <div class="formula-label">${label}</div>
        <input type="text" id="${inputId}" class="margin-formula-input" data-pb-setting-text="${key}" value="${formula.replace(/"/g, '&quot;')}" spellcheck="false">
        <div class="formula-note" id="formula-note-${key}">
          ${!check.ok ? `<span style="color:#b91c1c">${check.error}</span>` : ''}
          ${extraNoteHtml || ''}
        </div>
      </div>`;
}

// One shared toolbar of every variable/operator used across all formulas,
// shown once at the top of the popup — click a formula field, then tap a
// symbol here to insert it there, instead of the same chips repeating under
// every field.
function sharedChipToolbarHtml(){
  const allVars = [...new Set(Object.values(PB_FORMULAS).flatMap(f => f.vars))];
  const varChips = allVars.map(v => `<button type="button" class="chip chip-var" data-insert="${v}">${v}</button>`).join('');
  const opChips = PB_OPERATOR_CHIPS.map(c => `<button type="button" class="chip chip-op" data-insert="${chipInsertText(c)}">${c}</button>`).join('');
  const ntdChip = `<button type="button" class="chip chip-var" data-insert="NTD" title="type an amount right after, e.g. NTD1500">NTD&hellip;</button>`;
  return `
      <div class="chip-toolbar">
        <div class="chip-toolbar-hint">Tap into a formula field below, then tap a symbol here to insert it there:</div>
        <div class="chip-row chip-row-toolbar">${varChips}<span class="chip-sep"></span>${opChips}<span class="chip-sep"></span>${ntdChip}</div>
      </div>`;
}

function renderCalcSettings(){
  const { rate, shipRatePerKg, boxDims, rateFetchedAt } = pbSettings;

  const rateRowHtml = `
      <div class="formula-row">
        <div class="formula-label">TWD&rarr;IDR rate</div>
        <div class="chip-row" style="margin-top:0">
          <input type="number" step="0.01" min="0" id="rate-input" data-pb-setting="rate" value="${rate}" style="width:110px;padding:6px 10px;border:1.5px solid var(--rose-line);border-radius:8px;font-family:inherit;font-size:13px !important;color:var(--ink);background:#fff">
          <button type="button" class="chip chip-var" id="fetchRateBtn">&#8635; Fetch live rate</button>
        </div>
        <div class="formula-note" id="rate-fetch-status">
          ${rateFetchedAt ? `market rate as of ${new Date(rateFetchedAt).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})} — the site's own price may run higher` : 'used in the cost &amp; sell formulas above; fetch pulls the current TWD&rarr;IDR market rate'}
        </div>
      </div>`;

  const boxRowHtml = `
      <div class="formula-row">
        <div class="formula-label">Box (cm)</div>
        <div class="formula-note" style="margin-top:0">
          <label>L<input type="number" step="0.1" min="0" data-pb-dim="l" value="${boxDims.l}"></label>
          <label>W<input type="number" step="0.1" min="0" data-pb-dim="w" value="${boxDims.w}"></label>
          <label>H<input type="number" step="0.1" min="0" data-pb-dim="h" value="${boxDims.h}"></label>
          <label>IDR per kg<input type="number" step="1000" min="0" data-pb-setting="shipRatePerKg" value="${shipRatePerKg}"></label>
        </div>
      </div>`;

  return `
    <div class="formula-card">
      ${sharedChipToolbarHtml()}
      <div class="formula-grid">
        <div class="formula-row">
          <div class="formula-label">Site price</div>
          <code>orig</code>
          <div class="formula-note">the site's already-discounted NT$ sale price (e.g. NT$15,000 for the PB-X1, not the crossed-out NT$15,300), shown as-is (not editable) — type <code>NTD1500</code> in any field to add an NT$ amount, auto-converted at the current rate</div>
        </div>
        ${formulaRowHtml('costFormula', { ntd: 1, orig: 1, rate: 1, shipping: 1 })}
        ${formulaRowHtml('websiteSellFormula', { ntd: 1, orig: 1, rate: 1, shipping: 1, cost: 1 },
          'what you charge the customer')}
        ${formulaRowHtml('shippingFormula', { l: 1, w: 1, h: 1, rate: 1, fins: PB_FINS_PER_BOX },
          'rate here is IDR per kg, l/w/h come from the box below, fins is fixed at ' + PB_FINS_PER_BOX)}
        ${rateRowHtml}
        ${boxRowHtml}
        ${formulaRowHtml('marginFormula', { ntd: 1, orig: 1, rate: 1, shipping: 1, cost: 1, websiteSell: 1 },
          'margin % (shown next to margin in the table) is margin as a % of the website sell price')}
      </div>
    </div>`;
}

function bindSettingInputs(container, onChanged){
  container.querySelectorAll('[data-pb-setting]').forEach(input => {
    input.addEventListener('change', e => {
      const key = e.target.dataset.pbSetting;
      const val = parseFloat(e.target.value);
      pbSettings[key] = isNaN(val) ? PB_DEFAULTS[key] : val;
      savePbSettings();
      onChanged();
    });
  });
  container.querySelectorAll('[data-pb-dim]').forEach(input => {
    input.addEventListener('change', e => {
      const dim = e.target.dataset.pbDim;
      const val = parseFloat(e.target.value);
      pbSettings.boxDims[dim] = isNaN(val) ? 0 : val;
      savePbSettings();
      onChanged();
    });
  });
  container.querySelectorAll('[data-pb-setting-text]').forEach(input => {
    input.addEventListener('focus', e => {
      e.target.dataset.lastFocused = '1';
      pbLastFocusedInputId = e.target.id;
    });
    input.addEventListener('change', e => {
      const key = e.target.dataset.pbSettingText;
      const val = e.target.value.trim();
      pbSettings[key] = val || PB_DEFAULTS[key];
      savePbSettings();
      onChanged();
    });
  });
  // Variable/operator chips: insert the chip's text into whichever formula
  // field was last focused (a chip carries its own data-target-input only
  // where one still applies; the shared toolbar chips don't, so they fall
  // back to pbLastFocusedInputId, or the first formula field if nothing has
  // been focused yet), at that field's last cursor position (or the end, if
  // the field was never focused yet) — then let the normal change handling
  // above save & recalc.
  container.querySelectorAll('[data-insert]').forEach(chip => {
    chip.addEventListener('click', () => {
      const targetId = chip.dataset.targetInput || pbLastFocusedInputId || 'formula-input-costFormula';
      const input = document.getElementById(targetId);
      if(!input) return;
      const text = chip.dataset.insert;
      // Only trust the field's cursor position if it's the one the user was
      // last actually focused on — a freshly re-rendered field defaults its
      // selection to 0, which would make every chip prepend instead of
      // append when nobody has clicked into the field yet.
      const wasFocused = input.dataset.lastFocused === '1';
      const start = wasFocused && input.selectionStart != null ? input.selectionStart : input.value.length;
      const end = wasFocused && input.selectionEnd != null ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0, start) + text + input.value.slice(end);
      const pos = start + text.length;
      input.focus();
      input.setSelectionRange(pos, pos);
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });
  });
}

// Live TWD -> IDR market rate, pulled from a free no-key currency API.
// This is the general market rate, not prussianbluefins.com's own visitor
// pricing (the site marks its displayed Rupiah prices up from the market
// rate, and that markup isn't something a static page can read off the
// site itself) — treat it as a current, trustworthy starting point for the
// rate field above rather than an exact match to the site's own number.
const PB_RATE_APIS = [
  'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.json',
  'https://open.er-api.com/v6/latest/TWD',
];
async function fetchLiveTwdToIdr(){
  let lastError;
  for(const url of PB_RATE_APIS){
    try {
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const value = data.twd ? data.twd.idr : (data.rates ? data.rates.IDR : undefined);
      if(typeof value === 'number' && value > 0) return value;
      throw new Error('IDR rate missing from response');
    } catch(e){ lastError = e; }
  }
  throw lastError || new Error('No rate source reachable');
}

function renderAndBindPB(){
  document.getElementById('view').innerHTML = renderTables();
  bindCartEvents(document.getElementById('view'));

  const calcBody = document.getElementById('calcBody');
  calcBody.innerHTML = renderCalcSettings();
  bindSettingInputs(calcBody, renderAndBindPB);

  const cartBody = document.getElementById('cartBody');
  cartBody.innerHTML = renderCartBody();
  bindCartEvents(cartBody);
  const badge = document.getElementById('cartBadge');
  const count = cartCount();
  badge.textContent = count > 0 ? String(count) : '';
  badge.hidden = count === 0;

  const fetchBtn = document.getElementById('fetchRateBtn');
  const statusEl = document.getElementById('rate-fetch-status');
  fetchBtn.addEventListener('click', async () => {
    fetchBtn.disabled = true;
    fetchBtn.textContent = 'Fetching…';
    statusEl.textContent = '';
    try {
      const idrPerTwd = await fetchLiveTwdToIdr();
      pbSettings.rate = idrPerTwd;
      pbSettings.rateFetchedAt = Date.now();
      savePbSettings();
      renderAndBindPB();
    } catch(e){
      fetchBtn.disabled = false;
      fetchBtn.innerHTML = '&#8635; Fetch live rate';
      statusEl.innerHTML = `<span style="color:#b91c1c">Couldn't fetch a live rate (${e.message}) — enter it manually.</span>`;
    }
  });
}

renderAndBindPB();

let saveStatusTimer = null;
document.getElementById('saveCalcBtn').addEventListener('click', () => {
  savePbSettings();
  const statusEl = document.getElementById('calcSaveStatus');
  statusEl.textContent = 'Saved!';
  statusEl.classList.add('show');
  clearTimeout(saveStatusTimer);

});
