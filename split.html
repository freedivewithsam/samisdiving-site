<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trip Bill Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="app-css">
  :root {
    --yellow: #FBF6C4; --peach: #FCE1C2; --pink: #FFC7CE; --orchid: #F1C6EF; --lav: #D6C3F0;
    --blue: #AEC1F2; --sky: #97DCF5; --cyan: #8EF0F0; --aqua: #97F5D9; --green: #B3F5C0;
    --bg: #fbfaf6; --surface: #ffffff; --surface-2: #f4f2ea; --ink: #1e2b2a; --ink-soft: #4b5957;
    --ink-faint: #8a938e; --line: #e2ded0; --accent: #4fb8a8; --accent-ink: #0d3d38;
    --good: #2f8f5b; --good-bg: #e1f3e6; --warn: #b5791f; --warn-bg: #f7ecd8; --shadow: rgba(30,43,42,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10161a; --surface: #182124; --surface-2: #1e2a2d; --ink: #eef2ee; --ink-soft: #b6c2bd;
      --ink-faint: #7c8b86; --line: #2b3a3c; --accent: #6fd0bd; --accent-ink: #0d3d38;
      --good: #6fd08a; --good-bg: #1e3324; --warn: #e0ac52; --warn-bg: #3a2f18; --shadow: rgba(0,0,0,0.35);
      --yellow: #6b6635; --peach: #6b5636; --pink: #6b3d43; --orchid: #5e3d5c; --lav: #473d5e;
      --blue: #37456b; --sky: #2f5566; --cyan: #2c5f5f; --aqua: #2f5f4f; --green: #3c5f43;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10161a; --surface: #182124; --surface-2: #1e2a2d; --ink: #eef2ee; --ink-soft: #b6c2bd;
    --ink-faint: #7c8b86; --line: #2b3a3c; --accent: #6fd0bd; --accent-ink: #0d3d38;
    --good: #6fd08a; --good-bg: #1e3324; --warn: #e0ac52; --warn-bg: #3a2f18; --shadow: rgba(0,0,0,0.35);
    --yellow: #6b6635; --peach: #6b5636; --pink: #6b3d43; --orchid: #5e3d5c; --lav: #473d5e;
    --blue: #37456b; --sky: #2f5566; --cyan: #2c5f5f; --aqua: #2f5f4f; --green: #3c5f43;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 860px; margin: 0 auto; padding-block: clamp(20px, 4vw, 48px) 72px; padding-inline: clamp(16px, 4vw, 32px); display: flex; flex-direction: column; gap: 20px; }
  .mono, .money { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem; color: var(--accent); font-weight: 600; margin: 0 0 4px; }
  .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .trip-title { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(1.9rem, 4.2vw, 2.7rem); letter-spacing: -0.01em; line-height: 1.15; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
  .rename-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; font-size: 0.76rem; font-weight: 600; padding: 4px 10px; white-space: nowrap; }
  .rename-btn:hover { color: var(--ink); border-color: var(--accent); }
  .rename-form { display: flex; flex-direction: column; gap: 8px; }
  .rename-actions { display: flex; gap: 8px; }
  input.trip-name[type="text"] { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(1.5rem, 4vw, 2.2rem); background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; color: var(--ink); padding: 6px 12px; width: 100%; max-width: 22ch; }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status { font-size: 0.78rem; color: var(--ink-faint); padding: 5px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
  .status.saving { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .status.saved { color: var(--good); background: var(--good-bg); border-color: transparent; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(16px, 2.6vw, 24px); box-shadow: 0 1px 2px var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.2rem; margin: 0; text-wrap: balance; }
  .hint { font-size: 0.84rem; color: var(--ink-soft); margin: 0; }
  .label { display: block; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin-bottom: 5px; }

  input[type="text"], input[type="date"], select { width: 100%; font-family: inherit; font-size: 0.95rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
  input.formula { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder { color: var(--ink-faint); }
  input.err { border-color: var(--warn); background: var(--warn-bg); }

  button { font-family: inherit; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 999px; font-weight: 600; font-size: 0.88rem; padding: 10px 18px; }
  .btn:hover { filter: brightness(1.05); }
  a.btn { text-decoration: none; }
  .btn.ghost { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--accent); filter: none; }
  .btn.small { font-size: 0.78rem; padding: 6px 12px; }
  .x { background: transparent; border: none; color: var(--ink-faint); padding: 4px 8px; border-radius: 8px; font-size: 0.95rem; line-height: 1; }
  .x:hover { background: var(--surface-2); color: var(--warn); }

  /* who am I */
  .me-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; color: var(--ink-soft); }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 0.86rem; font-weight: 500; }
  .chip .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--c); display: inline-grid; place-items: center; font-size: 0.66rem; font-weight: 700; color: var(--ink); }
  button.chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .chip.off { opacity: 0.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  /* settle */
  .you-card { border-radius: 14px; padding: 14px 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
  .you-card .big { font-family: "Fraunces", serif; font-weight: 600; font-size: 1.25rem; }
  .you-card.owe { background: var(--warn-bg); } .you-card.owe .big { color: var(--warn); }
  .you-card.get { background: var(--good-bg); } .you-card.get .big { color: var(--good); }
  .transfers { display: flex; flex-direction: column; gap: 8px; }
  .transfer { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .transfer.mine { border-color: var(--accent); background: var(--surface-2); }
  .transfer .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 500; min-width: 0; }
  .arrow { color: var(--ink-faint); font-size: 0.8rem; }
  .transfer .amt { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
  .done-note { text-align: center; color: var(--good); background: var(--good-bg); border-radius: 12px; padding: 14px; font-weight: 500; }
  @media (max-width: 520px) {
    .transfer { grid-template-columns: 1fr auto; }
    .transfer .who { grid-column: 1 / -1; }
  }

  /* balances */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  td, th { white-space: nowrap; }
  @media (max-width: 520px) { td { font-size: 0.78rem; padding: 9px 5px; } th { padding: 0 5px 8px; } }
  th { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; text-align: right; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 9px 8px; text-align: right; font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; font-size: 0.9rem; border-bottom: 1px solid var(--line); }
  td:first-child { font-family: "Space Grotesk", sans-serif; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.pos { color: var(--good); } td.neg { color: var(--warn); }
  tfoot td { font-weight: 600; border-top: 1px solid var(--line); }
  .pname { display: inline-flex; align-items: center; gap: 8px; }
  .pname .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

  .add-person { display: flex; gap: 8px; }
  .add-person input { flex: 1; min-width: 0; }
  .people-edit { display: flex; flex-wrap: wrap; gap: 8px; }
  .people-edit .chip { padding-right: 4px; }
  .chip.add-chip { border-style: dashed; color: var(--accent); background: transparent; padding: 5px 12px; font-weight: 600; }
  .add-person.quick { margin-top: 10px; }
  .add-person.quick input { padding: 8px 10px; }
  .inline-msg.ok-msg { color: var(--good); margin-top: 6px; }
  .inline-msg { font-size: 0.8rem; color: var(--warn); margin: 0; }

  /* form */
  .form-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
  .split-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .linkish { background: none; border: none; color: var(--accent); font-size: 0.78rem; font-weight: 600; padding: 0; }
  .each { font-size: 0.8rem; color: var(--ink-soft); margin-top: 8px; }

  /* expense list */
  .exp-list { display: flex; flex-direction: column; }
  .exp { display: grid; grid-template-columns: 4px minmax(0,1fr) auto auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .exp:last-child { border-bottom: none; }
  .exp .bar { align-self: stretch; border-radius: 4px; background: var(--c); }
  .exp .desc { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
  .exp .meta { font-size: 0.78rem; color: var(--ink-faint); overflow-wrap: anywhere; }
  .exp .amt { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .exp.payment .desc { color: var(--good); font-weight: 500; }
  .exp .acts { display: flex; gap: 2px; }
  .exp.editing { background: var(--surface-2); border-radius: 10px; }
  .day { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); font-weight: 600; padding: 14px 4px 4px; }
  .day:first-child { padding-top: 0; }

  .empty { text-align: center; color: var(--ink-faint); font-size: 0.88rem; padding: 22px 10px; border: 1px dashed var(--line); border-radius: 14px; }
  .ro-note { font-size: 0.8rem; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  footer.foot { color: var(--ink-faint); font-size: 0.78rem; border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sheet-panel summary { cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.05rem; list-style: none; }
  .sheet-panel summary::-webkit-details-marker { display: none; }
  .sheet-panel summary::before { content: "▸"; color: var(--accent); margin-right: 8px; font-size: 0.9rem; }
  .sheet-panel[open] summary::before { content: "▾"; }
  .sheet-panel summary > span:first-child { flex: 1; }
  .sheet-panel code { font-family: "JetBrains Mono", monospace; font-size: 0.85em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .sheet-panel[open] { gap: 12px; }
  .topbar { display: flex; margin-bottom: -8px; }
  .nav-btn { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; padding: 6px 14px; font-size: 0.84rem; font-weight: 600; }
  .nav-btn:hover { color: var(--ink); border-color: var(--accent); }
  .tabs { margin-bottom: -6px; }
  .tab-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .tab { flex: none; background: transparent; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; padding: 7px 14px; font-size: 0.84rem; font-weight: 600; white-space: nowrap; }
  .tab:hover { color: var(--ink); border-color: var(--accent); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tab.add { border-style: dashed; color: var(--accent); }
  .new-trip { gap: 12px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.86rem; color: var(--ink-soft); }
  .check input { margin-top: 4px; accent-color: var(--accent); }
  .del-trip { display: flex; flex-direction: column; gap: 10px; background: var(--warn-bg); border-radius: 14px; padding: 14px 16px; font-size: 0.9rem; }
  .del-trip p { margin: 0; }
  .del-trip .form-actions { justify-content: flex-start; }
  .rename-btn.del:hover { color: var(--warn); border-color: var(--warn); }
  .linkish.muted { color: var(--ink-faint); font-weight: 500; }
  .linkish.muted:hover { color: var(--warn); }
  .btn.danger { background: var(--warn); color: var(--surface); }
  .scan-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .scan-btn { cursor: pointer; }
  .scan-btn.disabled { opacity: 0.5; pointer-events: none; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { background: transparent; border: none; color: var(--ink-soft); font-weight: 600; font-size: 0.78rem; padding: 6px 12px; border-radius: 999px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .scan-status { margin: 0; font-size: 0.84rem; color: var(--ink-soft); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
  .scan-status.busy { color: var(--accent-ink); background: var(--good-bg); }
  .amt-auto { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
  .bill-box { display: flex; flex-direction: column; gap: 12px; }
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
  .item.need { border-color: var(--warn); border-style: dashed; }
  .item-top { display: grid; grid-template-columns: minmax(0, 1fr) 118px auto; gap: 8px; align-items: center; }
  .item-top input { padding: 8px 10px; font-size: 0.9rem; }
  .item-top input.price { text-align: right; }
  @media (max-width: 520px) {
    .item-top { grid-template-columns: minmax(0, 1fr) auto; }
    .item-top input:first-child { grid-column: 1 / -1; }
  }
  .chips.mini { gap: 6px; align-items: center; }
  .item-pay { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 600; }
  .item-pay select { width: auto; min-width: 120px; padding: 5px 8px; font-size: 0.84rem; text-transform: none; letter-spacing: 0; }
  .pp-head { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
  .owe-head { margin-top: 10px; margin-bottom: -4px; }
  .chips.mini .chip { font-size: 0.78rem; padding: 3px 10px 3px 4px; }
  .chips.mini .chip .dot { width: 18px; height: 18px; }
  .extras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .extras { grid-template-columns: 1fr 1fr; } .extras > div:first-child { grid-column: 1 / -1; } }
  .sum-lines { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
  .sum-lines > div, .per-person > div { display: flex; justify-content: space-between; gap: 10px; }
  .sum-lines .pct { font-size: 0.78rem; color: var(--ink-faint); font-weight: 600; }
  .sum-lines .grand { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
  .check { margin: 8px 0 0; font-size: 0.82rem; border-radius: 10px; padding: 8px 12px; }
  .check.ok { color: var(--good); background: var(--good-bg); }
  .check.warn { color: var(--warn); background: var(--warn-bg); }
  .per-person { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .per-person .muted { color: var(--ink-faint); flex: 1; text-align: right; font-size: 0.78rem; }
  .raw summary { cursor: pointer; font-size: 0.78rem; color: var(--ink-faint); }
  .raw pre { white-space: pre-wrap; font-size: 0.72rem; color: var(--ink-soft); background: var(--surface-2); padding: 10px; border-radius: 10px; max-height: 240px; overflow: auto; }
  /* ---------- phones ---------- */
  .tab { max-width: 70vw; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 560px) {
    /* 16px text in fields stops iPhones zooming in when you tap one */
    input[type="text"], input[type="date"], select, .item-top input, .add-person.quick input, .item-pay select { font-size: 16px; }
    /* bigger tap targets */
    .x { min-width: 36px; min-height: 36px; font-size: 1.05rem; }
    .chip { min-height: 34px; }
    .btn.small { min-height: 34px; }
    .wrap { gap: 16px; }
    .panel { border-radius: 16px; }
    /* "Who paid what" as stacked rows, so the balance is always visible */
    table, thead, tbody, tfoot, tr, td { display: block; }
    table { min-width: 0; }
    thead { display: none; }
    tbody tr, tfoot tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    tfoot tr { border-bottom: none; }
    td { padding: 0; border: none; text-align: left; font-size: 0.84rem; white-space: normal; }
    td:first-child { grid-column: 1; grid-row: 1; }
    td.bal { grid-column: 2; grid-row: 1; text-align: right; font-weight: 600; font-size: 0.95rem; }
    td[data-label] { grid-column: 1 / -1; color: var(--ink-faint); font-size: 0.78rem; display: inline; }
    td[data-label]::before { content: attr(data-label) " Rp "; }
    tbody tr td[data-label="Paid"] { grid-row: 2; }
    tbody tr td[data-label="Share"] { grid-row: 3; }
    tfoot td[data-label] { grid-column: 2; grid-row: 1; text-align: right; color: var(--ink); font-size: 0.9rem; font-weight: 600; }
    tfoot td[data-label]::before { content: "Rp "; }
    td.empty-cell { display: none; }
    tfoot td { border-top: none; }
  }
  .readonly .edit-only { display: none !important; }
  .busy { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app"></div>

<script type="application/json" id="trip-data">{"trip":"Our trip","currency":"IDR","people":[],"expenses":[]}</script>

<script id="app-js">
(function () {
  "use strict";
  var PALETTE = ["sky","pink","green","lav","peach","aqua","orchid","yellow","blue","cyan"];
  var LS_ME = "splitbill_me", LS_LOCAL = "splitbill_local_state";

  // all = { trips: [ {id, trip (name), created, people, expenses} ] }; state = the trip on screen.
  function normalize(x) {
    x = x || {};

  /* ---------- split by item + receipt scanning ---------- */
  // bill = null (equal split) or { items:[{id,name,price,who:[]}], service:"", tax:"", discount:"", receiptTotal, raw }
  var bill = null;
  var scan = { busy: false, progress: 0, msg: "" };

  function defaultPayer() {
    var el = document.getElementById("f-paid");
    return (el && el.value) || (person(me) ? me : "") || (state.people[0] ? state.people[0].id : "");
  }
  function newItem(name, price, paidBy) { return { id: uid(), name: name || "", price: price == null ? "" : String(price), who: [], paidBy: paidBy || defaultPayer() }; }

  // "10%" → percent of base, otherwise a number or quick sum. Blank = 0.
  function extraAmount(str, base) {
    str = String(str || "").trim();
    if (!str) return 0;
    var m = str.match(/^(\d+(?:[.,]\d+)?)\s*%$/);
    if (m) return base * parseFloat(m[1].replace(",", ".")) / 100;
    var n = evalFormula(str);
    return isNaN(n) ? NaN : n;
  }

  // Works out each person's share: their items, plus service and tax in proportion, minus discount.
  function computeBill(b) {
    var out = { subtotal: 0, unassigned: 0, perItems: {}, shares: {}, perPayer: {}, paid: {}, bad: [] };
    state.people.forEach(function (p) { out.perItems[p.id] = 0; out.perPayer[p.id] = 0; });
    b.items.forEach(function (it) {
      var price = evalFormula(it.price);
      if (isNaN(price)) { if (String(it.price).trim()) out.bad.push(it.id); price = 0; }
      out.subtotal += price;
      var payer = out.perPayer[it.paidBy] != null ? it.paidBy : defaultPayer();
      if (out.perPayer[payer] != null) out.perPayer[payer] += price;
      var who = it.who.filter(function (id) { return out.perItems[id] != null; });
      if (!who.length) { out.unassigned += price; return; }
      who.forEach(function (id) { out.perItems[id] += price / who.length; });
    });
    out.discount = extraAmount(b.discount, out.subtotal);
    var afterDisc = out.subtotal - (out.discount || 0);
    out.service = extraAmount(b.service, afterDisc);
    out.tax = extraAmount(b.tax, afterDisc + (out.service || 0));
    ["discount", "service", "tax"].forEach(function (k) { if (isNaN(out[k])) { out.bad.push(k); out[k] = 0; } });
    out.total = Math.round(afterDisc + out.service + out.tax);
    var assigned = out.subtotal - out.unassigned;
    var factor = assigned > 0 ? out.total / out.subtotal : 0;
    // round to whole rupiah, and put any leftover rupiah on the biggest share so it adds up exactly
    var ids = Object.keys(out.perItems).filter(function (id) { return out.perItems[id] > 0; });
    var sum = 0, biggest = null;
    ids.forEach(function (id) {
      out.shares[id] = Math.round(out.perItems[id] * factor);
      sum += out.shares[id];
      if (!biggest || out.shares[id] > out.shares[biggest]) biggest = id;
    });
    if (biggest && !out.unassigned) out.shares[biggest] += out.total - sum;
    // what each payer actually paid: their items, plus service and tax in the same proportion
    var pf = out.subtotal > 0 ? out.total / out.subtotal : 0, psum = 0, top = null;
    Object.keys(out.perPayer).forEach(function (id) {
      if (out.perPayer[id] <= 0) return;
      out.paid[id] = Math.round(out.perPayer[id] * pf);
      psum += out.paid[id];
      if (!top || out.paid[id] > out.paid[top]) top = id;
    });
    if (top) out.paid[top] += out.total - psum;
    out.payers = Object.keys(out.paid);
    out.mainPayer = top;
    return out;
  }

  function pctText(part, whole) {
    if (!whole) return "";
    var p = part / whole * 100, r = Math.round(p * 100) / 100;
    return (Math.abs(p - Math.round(p)) < 0.02 ? String(Math.round(p)) : r.toLocaleString("en-US", { maximumFractionDigits: 2 })) + "%";
  }
  function billSummary(c) {
    var h = '<div class="sum-lines">';
    h += '<div><span>Items</span><span class="money">' + fmt(c.subtotal) + "</span></div>";
    if (c.discount) h += '<div><span>Discount</span><span class="money">−' + fmt(c.discount) + "</span></div>";
    var feeBase = c.subtotal - (c.discount || 0);

  }

  /* ---------- Google Sheet sync (standalone file only) ---------- */
  var sheetLink = lsGet("splitbill_sheet_link") || "", sheetError = "";

  function hasTrip(a) { return a.trips.some(function (t) { return t.people.length || t.expenses.length; }); }

  function sheetPanel() {
    var h = '<details class="panel sheet-panel" id="sheet-panel"' + (sheetOpen ? " open" : "") + '><summary><span>Google Sheet</span><span class="hint">' + (sheetError ? "Problem" : "Connected") + "</span></summary>";
    h += '<p class="hint">Every bill saves to the trip\'s Google Sheet, and the page checks for friends\' changes every 30 seconds. Anyone who opens this page shares the same trip.</p>';
    if (sheetError) h += '<p class="inline-msg">' + esc(sheetError) + "</p>";
    h += '<div class="form-actions" style="justify-content:flex-start">';
    if (sheetLink) h += '<a class="btn ghost small" href="' + esc(sheetLink) + '" target="_blank" rel="noopener">Open the sheet</a>';
    h += '<button type="button" class="btn ghost small" data-act="upload">Send this phone\'s bills to the sheet</button>';
    h += '<button type="button" class="btn ghost small" data-act="sync">Refresh now</button>';
    h += '<button type="button" class="btn ghost small" data-act="invite">Copy link for friends</button></div>';
    return h + "</details>";
  }

  function jsonp(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cb = "__splitbill_" + Math.random().toString(36).slice(2);
      var tag = document.createElement("script");
      var timer = setTimeout(function () { done(); reject(new Error("The sheet didn't answer in time.")); }, timeoutMs || 20000);
      function done() { clearTimeout(timer); delete window[cb]; tag.remove(); }
      window[cb] = function (data) { done(); resolve(data); };
      tag.onerror = function () { done(); reject(new Error("Couldn't reach the sheet. Check the Web app access is set to Anyone.")); };
      tag.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
      document.head.appendChild(tag);
    });
  }

  function sheetFailed(err) {
    sheetError = (err && err.message) || String(err);
    setStatus(navigator.onLine === false ? "Offline · showing last copy" : "Sheet problem · see below", "saving");
    render();
  }

  function gotSheetInfo(res) {
    if (res.sheet && res.sheet !== sheetLink) { sheetLink = res.sheet; lsSet("splitbill_sheet_link", sheetLink); }
    if (sheetError) { sheetError = ""; render(); }
  }

  var lastSheetJson = "";
  app.addEventListener("toggle", function (ev) { if (ev.target.id === "sheet-panel") sheetOpen = ev.target.open; }, true);

  function pullSheet(force) {
    if (outbox.length && !force) return Promise.resolve();
    return jsonp(sheetUrl).then(function (res) {
      if (!res || !res.ok) throw new Error("The sheet replied with an error: " + ((res && res.error) || "unknown"));
      gotSheetInfo(res);
      if (outbox.length) return; // this phone's edits are still on their way
      if (res.state && res.state.memory) mergeMem(res.state.memory);
      var incoming = normalize(res.state);
      if (!hasTrip(incoming) && hasTrip(all)) {
        // The sheet is empty but this phone already has a trip: send it up, never wipe it.
        uploadAll();
        return;
      }
      var js = JSON.stringify(res.state);
      if (js !== lastSheetJson) {
        lastSheetJson = js;
        all = incoming;
        pick();
        lsSet(LS_LOCAL, JSON.stringify(all));
        render();
      }
      setStatus("Synced", "saved");
    }).catch(sheetFailed);
  }

  function uploadAll() {
    var ops = [];
    all.trips.forEach(function (t) {
      ops.push({ type: "createTrip", trip: { id: t.id, name: t.trip, created: t.created } });
      t.people.forEach(function (p) { ops.push({ type: "upsertPerson", tripId: t.id, person: p }); });
      t.expenses.forEach(function (x) { ops.push({ type: "upsertExpense", tripId: t.id, expense: x }); });
    });
    queueOps(ops); // upserts by id, so sending twice never duplicates
  }

  function queueOps(ops) {
    if (!ops.length) return;
    outbox = outbox.concat(ops);
    lsSet(LS_OUTBOX, JSON.stringify(outbox));
    flushOutbox();
  }

  // Send queued changes in small batches over JSONP, so each one is confirmed by the sheet.
  function nextBatch() {
    var batch = [];
    for (var i = 0; i < outbox.length; i++) {
      var trial = batch.concat([outbox[i]]);
      if (batch.length && encodeURIComponent(JSON.stringify(trial)).length > 1500) break;
      batch = trial;
    }
    return batch;
  }

  var flushing = false, retryTimer = null;
  function flushOutbox() {
    if (flushing || !outbox.length) return;
    flushing = true;
    var batch = nextBatch();
    setStatus("Saving to sheet… " + outbox.length + " left", "saving");
    jsonp(sheetUrl + "?action=write&ops=" + encodeURIComponent(JSON.stringify(batch))).then(function (res) {
      if (!res || !res.ok) throw new Error("The sheet refused the change: " + ((res && res.error) || "unknown"));
      gotSheetInfo(res);
      outbox = outbox.slice(batch.length);
      lsSet(LS_OUTBOX, JSON.stringify(outbox));
      flushing = false;
      if (outbox.length) flushOutbox();
      else { setStatus("Saved to sheet", "saved"); setTimeout(function () { pullSheet(); }, 1500); }
    }).catch(function (err) {
      flushing = false;
      sheetFailed(err);
      setStatus(outbox.length + " change" + (outbox.length === 1 ? "" : "s") + " waiting to save", "saving");
      clearTimeout(retryTimer);
      retryTimer = setTimeout(flushOutbox, 20000);
    });
  }

  function goSheet() {
    mode = "sheet";
    if (local) { try { all = normalize(JSON.parse(local)); pick(); } catch (e) {} }
    setStatus("Connecting…", "saving");
    render();
    if (outbox.length) flushOutbox(); else pullSheet();
    setInterval(function () { if (!document.hidden) { if (outbox.length) flushOutbox(); else pullSheet(); } }, 30000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) pullSheet(); });
    window.addEventListener("online", flushOutbox);
  }

  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]"); if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "sync") { if (outbox.length) flushOutbox(); else pullSheet(true); }
    if (act === "upload") { uploadAll(); t.textContent = "Sending…"; }
    if (act === "invite") {
      var link = location.href.split("?")[0].split("#")[0];
      var done = function () { t.textContent = "Link copied"; setTimeout(function () { t.textContent = "Copy link for friends"; }, 1600); };
      try { navigator.clipboard.writeText(link).then(done, function () { fallback(link); done(); }); } catch (e) { fallback(link); done(); }
    }
  });

  /* ---------- boot ---------- */
  var local = lsGet(LS_LOCAL);
  setStatus("Loading…", "");
  render();

  function goLocal() {
    mode = "local";
    if (local) { try { all = normalize(JSON.parse(local)); pick(); } catch (e) {} }
    setStatus("Saved on this device", "saved");
    render();
  }

  // Opened directly (or in a plain preview frame): use the Google Sheet.
  // Only inside a Claude artifact, which can't reach Google, does the page save itself instead.
  var tries = 0;
  if (!embedded) { goSheet(); return; }
  (function waitForHost() {
    if (window.claude && typeof window.claude.use === "function") connect();
    else if (++tries < 15) setTimeout(waitForHost, 100);
    else goSheet();
  })();

  function connect() {
    Promise.all([
      window.claude.use("artifact").catch(function () { return null; }),
      window.claude.use("user").catch(function () { return null; })
    ]).then(function (res) {
      artifactApi = res[0];
      var user = res[1];
      if (!artifactApi) { goLocal(); return; }
      var canEdit = user && user.canEdit ? user.canEdit().catch(function () { return true; }) : Promise.resolve(true);
      canEdit.then(function (ok) {
        mode = ok ? "shared" : "readonly";
        setStatus(ok ? "Saved" : "View only", ok ? "saved" : "");
        render();
      });
    });
  }
})();
</script>

</body>
</html>
