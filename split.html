<body>

<style id="app-css">
  :root {

      --bg: #10161a; --surface: #182124; --surface-2: #1e2a2d; --ink: #eef2ee; --ink-soft: #b6c2bd;

      --good: #6fd08a; --good-bg: #1e3324; --warn: #e0ac52; --warn-bg: #3a2f18; --shadow: rgba(0,0,0,0.35);
      --yellow: #6b6635; --peach: #6b5636; --pink: #6b3d43; --orchid: #5e3d5c; --lav: #473d5e;
      --blue: #37456b; --sky: #2f5566; --cyan: #2c5f5f; --aqua: #2f5f4f; --green: #3c5f43;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10161a; --surface: #182124; --surface-2: #1e2a2d; --ink: #eef2ee; --ink-soft: #b6c2bd;
    --ink-faint: #7c8b86; --line: #2b3a3c; --accent: #6fd0bd; --accent-ink: #0d3d38;
    --good: #6fd08a; --good-bg: #1e3324; --warn: #e0ac52; --warn-bg: #3a2f18; --shadow: rgba(0,0,0,0.35);
    --yellow: #6b6635; --peach: #6b5636; --pink: #6b3d43; --orchid: #5e3d5c; --lav: #473d5e;
    --blue: #37456b; --sky: #2f5566; --cyan: #2c5f5f; --aqua: #2f5f4f; --green: #3c5f43;
  }
  * { box-sizing: border-box; }

  .wrap { max-width: 860px; margin: 0 auto; padding-block: clamp(20px, 4vw, 48px) 72px; padding-inline: clamp(16px, 4vw, 32px); display: flex; flex-direction: column; gap: 20px; }
  .mono, .money { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }

  .rename-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; font-size: 0.76rem; font-weight: 600; padding: 4px 10px; white-space: nowrap; }
  .rename-btn:hover { color: var(--ink); border-color: var(--accent); }

  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status { font-size: 0.78rem; color: var(--ink-faint); padding: 5px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
  .status.saving { color: var(--warn); background: var(--warn-bg); border-color: transparent; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(16px, 2.6vw, 24px); box-shadow: 0 1px 2px var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.2rem; margin: 0; text-wrap: balance; }
  .hint { font-size: 0.84rem; color: var(--ink-soft); margin: 0; }
  .label { display: block; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin-bottom: 5px; }

  input[type="text"], input[type="date"], select { width: 100%; font-family: inherit; font-size: 0.95rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
  input.formula { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }

  input::placeholder { color: var(--ink-faint); }

  button { font-family: inherit; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 999px; font-weight: 600; font-size: 0.88rem; padding: 10px 18px; }
  .btn:hover { filter: brightness(1.05); }
  a.btn { text-decoration: none; }
  .btn.ghost { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--accent); filter: none; }
  .btn.small { font-size: 0.78rem; padding: 6px 12px; }
  .x { background: transparent; border: none; color: var(--ink-faint); padding: 4px 8px; border-radius: 8px; font-size: 0.95rem; line-height: 1; }
  .x:hover { background: var(--surface-2); color: var(--warn); }

  /* who am I */
  .me-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; color: var(--ink-soft); }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 0.86rem; font-weight: 500; }
  .chip .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--c); display: inline-grid; place-items: center; font-size: 0.66rem; font-weight: 700; color: var(--ink); }
  button.chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  .you-card .big { font-family: "Fraunces", serif; font-weight: 600; font-size: 1.25rem; }
  .you-card.owe { background: var(--warn-bg); } .you-card.owe .big { color: var(--warn); }

  .transfer.mine { border-color: var(--accent); background: var(--surface-2); }
  .transfer .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 500; min-width: 0; }
  .arrow { color: var(--ink-faint); font-size: 0.8rem; }
  .transfer .amt { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
  .done-note { text-align: center; color: var(--good); background: var(--good-bg); border-radius: 12px; padding: 14px; font-weight: 500; }

  /* balances */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }

  th { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; text-align: right; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 9px 8px; text-align: right; font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; font-size: 0.9rem; border-bottom: 1px solid var(--line); }
  td:first-child { font-family: "Space Grotesk", sans-serif; font-weight: 600; }

  .pname { display: inline-flex; align-items: center; gap: 8px; }
  .pname .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

  .add-person { display: flex; gap: 8px; }
  .add-person input { flex: 1; min-width: 0; }
  .people-edit { display: flex; flex-wrap: wrap; gap: 8px; }
  .people-edit .chip { padding-right: 4px; }
  .chip.add-chip { border-style: dashed; color: var(--accent); background: transparent; padding: 5px 12px; font-weight: 600; }
  .add-person.quick { margin-top: 10px; }
  .add-person.quick input { padding: 8px 10px; }
  .inline-msg.ok-msg { color: var(--good); margin-top: 6px; }
  .inline-msg { font-size: 0.8rem; color: var(--warn); margin: 0; }

  /* form */
  .form-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
  .split-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .linkish { background: none; border: none; color: var(--accent); font-size: 0.78rem; font-weight: 600; padding: 0; }
  .each { font-size: 0.8rem; color: var(--ink-soft); margin-top: 8px; }

  /* expense list */
  .exp-list { display: flex; flex-direction: column; }
  .exp { display: grid; grid-template-columns: 4px minmax(0,1fr) auto auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .exp:last-child { border-bottom: none; }
  .exp .bar { align-self: stretch; border-radius: 4px; background: var(--c); }
  .exp .desc { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
  .exp .meta { font-size: 0.78rem; color: var(--ink-faint); overflow-wrap: anywhere; }
  .exp .amt { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .exp.payment .desc { color: var(--good); font-weight: 500; }
  .exp .acts { display: flex; gap: 2px; }
  .exp.editing { background: var(--surface-2); border-radius: 10px; }
  .day { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); font-weight: 600; padding: 14px 4px 4px; }
  .day:first-child { padding-top: 0; }

  .empty { text-align: center; color: var(--ink-faint); font-size: 0.88rem; padding: 22px 10px; border: 1px dashed var(--line); border-radius: 14px; }
  .ro-note { font-size: 0.8rem; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  footer.foot { color: var(--ink-faint); font-size: 0.78rem; border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sheet-panel summary { cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.05rem; list-style: none; }
  .sheet-panel summary::-webkit-details-marker { display: none; }
  .sheet-panel summary::before { content: "▸"; color: var(--accent); margin-right: 8px; font-size: 0.9rem; }
  .sheet-panel[open] summary::before { content: "▾"; }
  .sheet-panel summary > span:first-child { flex: 1; }
  .sheet-panel code { font-family: "JetBrains Mono", monospace; font-size: 0.85em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .sheet-panel[open] { gap: 12px; }
  .tabs { margin-bottom: -6px; }
  .tab-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .tab { flex: none; background: transparent; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; padding: 7px 14px; font-size: 0.84rem; font-weight: 600; white-space: nowrap; }
  .tab:hover { color: var(--ink); border-color: var(--accent); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tab.add { border-style: dashed; color: var(--accent); }
  .new-trip { gap: 12px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.86rem; color: var(--ink-soft); }
  .check input { margin-top: 4px; accent-color: var(--accent); }
  .del-trip { display: flex; flex-direction: column; gap: 10px; background: var(--warn-bg); border-radius: 14px; padding: 14px 16px; font-size: 0.9rem; }
  .del-trip p { margin: 0; }
  .del-trip .form-actions { justify-content: flex-start; }
  .rename-btn.del:hover { color: var(--warn); border-color: var(--warn); }
  .linkish.muted { color: var(--ink-faint); font-weight: 500; }
  .linkish.muted:hover { color: var(--warn); }
  .btn.danger { background: var(--warn); color: var(--surface); }
  .scan-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .scan-btn { cursor: pointer; }
  .scan-btn.disabled { opacity: 0.5; pointer-events: none; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { background: transparent; border: none; color: var(--ink-soft); font-weight: 600; font-size: 0.78rem; padding: 6px 12px; border-radius: 999px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .scan-status { margin: 0; font-size: 0.84rem; color: var(--ink-soft); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
  .scan-status.busy { color: var(--accent-ink); background: var(--good-bg); }
  .amt-auto { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
  .bill-box { display: flex; flex-direction: column; gap: 12px; }
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
  .item.need { border-color: var(--warn); border-style: dashed; }
  .item-top { display: grid; grid-template-columns: minmax(0, 1fr) 118px auto; gap: 8px; align-items: center; }
  .item-top input { padding: 8px 10px; font-size: 0.9rem; }
  .item-top input.price { text-align: right; }
  @media (max-width: 520px) {
    .item-top { grid-template-columns: minmax(0, 1fr) auto; }
    .item-top input:first-child { grid-column: 1 / -1; }
  }
  .chips.mini { gap: 6px; align-items: center; }
  .chips.mini .chip { font-size: 0.78rem; padding: 3px 10px 3px 4px; }
  .chips.mini .chip .dot { width: 18px; height: 18px; }
  .extras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .extras { grid-template-columns: 1fr 1fr; } .extras > div:first-child { grid-column: 1 / -1; } }
  .sum-lines { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
  .sum-lines > div, .per-person > div { display: flex; justify-content: space-between; gap: 10px; }
  .sum-lines .grand { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
  .check { margin: 8px 0 0; font-size: 0.82rem; border-radius: 10px; padding: 8px 12px; }
  .check.ok { color: var(--good); background: var(--good-bg); }
  .check.warn { color: var(--warn); background: var(--warn-bg); }
  .per-person { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .per-person .muted { color: var(--ink-faint); flex: 1; text-align: right; font-size: 0.78rem; }
  .raw summary { cursor: pointer; font-size: 0.78rem; color: var(--ink-faint); }
  .raw pre { white-space: pre-wrap; font-size: 0.72rem; color: var(--ink-soft); background: var(--surface-2); padding: 10px; border-radius: 10px; max-height: 240px; overflow: auto; }
  .readonly .edit-only { display: none !important; }
  .busy { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function round2(n) { return Math.round(n * 100) / 100; }
  // Currency is always IDR, shown as "Rp 1.250.000".
  function fmt(n) { return "Rp " + num(n); }
  function num(n) { return Math.round(Math.abs(n)).toLocaleString("id-ID"); }
  function person(id) { for (var i = 0; i < state.people.length; i++) if (state.people[i].id === id) return state.people[i]; return null; }
  function pname(id) { var p = person(id); return p ? p.name : "?"; }
  function pcolor(id) { var p = person(id); return p ? "var(--" + p.color + ")" : "var(--line)"; }
  function initials(name) { return String(name || "?").trim().slice(0, 1).toUpperCase(); }
  function chipHtml(id, extraClass) {
    return '<span class="chip ' + (extraClass || "") + '"><span class="dot" style="--c:' + pcolor(id) + '">' + esc(initials(pname(id))) + '</span>' + esc(pname(id)) + '</span>';
  }

  // Quick sums like "1200+350*2". Only digits and + - * / ( ) . pass.
  function evalFormula(str) {
    str = String(str || "").replace(/,/g, "").trim();
    if (!str) return NaN;
    if (/^\d+(\.\d+)?$/.test(str)) return parseFloat(str);
    if (!/^[0-9+\-*/().\s]+$/.test(str)) return NaN;
    try { var r = Function('"use strict";return (' + str + ")")(); return typeof r === "number" && isFinite(r) ? r : NaN; } catch (e) { return NaN; }
  }

  /* ---------- the maths ---------- */
  function balances() {
    var b = {};
    state.people.forEach(function (p) { b[p.id] = { paid: 0, share: 0, sent: 0, received: 0 }; });
    state.expenses.forEach(function (e) {
      var split = (e.split || []).filter(function (id) { return b[id]; });
      if (!b[e.paidBy] || !split.length) return;
      if (e.kind === "payment") {
        b[e.paidBy].sent += e.amount;
        b[split[0]].received += e.amount;
      } else {
        b[e.paidBy].paid += e.amount;
        if (e.shares) {
          Object.keys(e.shares).forEach(function (id) { if (b[id]) b[id].share += Number(e.shares[id]) || 0; });
        } else {
          var each = e.amount / split.length;
          split.forEach(function (id) { b[id].share += each; });
        }
      }
    });
    Object.keys(b).forEach(function (id) {
      var x = b[id];
      x.net = round2(x.paid + x.sent - x.share - x.received); // + means others owe them
    });
    return b;
  }

  function settle(b) {
    var cred = [], debt = [];
    Object.keys(b).forEach(function (id) {
      if (b[id].net > 0.005) cred.push({ id: id, amt: b[id].net });
      else if (b[id].net < -0.005) debt.push({ id: id, amt: -b[id].net });
    });
    cred.sort(function (a, c) { return c.amt - a.amt; });
    debt.sort(function (a, c) { return c.amt - a.amt; });
    var out = [], i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      var x = Math.min(debt[i].amt, cred[j].amt);
      if (x > 0.005) out.push({ from: debt[i].id, to: cred[j].id, amt: round2(x) });
      debt[i].amt -= x; cred[j].amt -= x;
      if (debt[i].amt < 0.005) i++;
      if (cred[j].amt < 0.005) j++;
    }
    return out;
  }

  /* ---------- saving ---------- */
  function resetCss() {
    var s = document.head && document.head.querySelector("style");
    return s ? s.textContent : ":root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}";
  }
  function buildDocument() {
    var data = JSON.stringify(all).replace(/</g, "\\u003c");
    var fonts = document.getElementById("app-fonts").getAttribute("href");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss() + "</style></head><body>" +
      "<title>" + esc(document.title) + "</title>\n" +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link id="app-fonts" href="' + esc(fonts) + '" rel="stylesheet">\n' +
      '<style id="app-css">' + document.getElementById("app-css").textContent + "</style>\n\n" +
      '<div id="app"></div>\n\n' +
      '<script type="application/json" id="trip-data">' + data + "<\/script>\n\n" +
      '<script id="app-js">' + document.getElementById("app-js").textContent + "<\/script></body></html>";
  }

  function changed(ops) {
    (ops || []).forEach(function (o) { if (!o.tripId) o.tripId = state.id; });
    render();
    if (mode === "sheet") { lsSet(LS_LOCAL, JSON.stringify(all)); queueOps(ops || []); return; }
    if (mode === "local") { lsSet(LS_LOCAL, JSON.stringify(all)); setStatus("Saved on this device", "saved"); return; }
    if (mode !== "shared") return;
    dirty = true;
    setStatus("Unsaved changes…", "saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 2500);
  }

  function save() {
    if (!dirty || saving || mode !== "shared") return;
    saving = true;
    setStatus("Saving…", "saving");
    document.getElementById("app").classList.add("busy");
    artifactApi.publish(buildDocument()).then(function () {
      dirty = false; setStatus("Saved", "saved"); // the view reloads to the new version
    }, function (err) {
      saving = false;
      document.getElementById("app").classList.remove("busy");
      var code = err && err.code;
      if (code === "conflict") { setStatus("Someone saved first. Reloading…", "saving"); return; }
      if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared") {
        mode = "readonly"; render(); return;
      }
      if (code === "rate_limited") { setStatus("Saving shortly…", "saving"); saveTimer = setTimeout(save, 8000); return; }
      setStatus("Couldn't save. Retrying…", "saving");
      saveTimer = setTimeout(save, 3000 + Math.random() * 2000);
    });
  }

  var statusText = "", statusClass = "";
  function setStatus(t, c) {
    statusText = t; statusClass = c || "";
    var el = document.getElementById("status");
    if (el) { el.textContent = t; el.className = "status " + statusClass; }
  }

  /* ---------- rendering ---------- */
  function render() {
    var app = document.getElementById("app");
    var focusId = document.activeElement && document.activeElement.id;
    var formVals = {};
    ["f-desc","f-amt","f-paid","f-date","new-person","nt-name","trip-name","quick-person"].forEach(function (id) { var el = document.getElementById(id); if (el) formVals[id] = el.value; });

    var b = balances();
    var transfers = settle(b);
    var ro = mode === "readonly";
    app.className = "wrap" + (ro ? " readonly" : "");
    if (me && !person(me)) me = "";

    var h = "";
    // trip tabs
    h += '<nav class="tabs" aria-label="Trips"><div class="tab-row">';
    all.trips.slice().reverse().forEach(function (t) {
      var on = t.id === state.id;
      h += '<button type="button" class="tab' + (on ? " on" : "") + '" data-act="tab" data-id="' + esc(t.id) + '"' + (on ? ' aria-current="page"' : "") + ">" + esc(t.trip) + "</button>";
    });
    h += '<button type="button" class="tab add edit-only" data-act="newtrip"' + (newTripOpen ? ' aria-expanded="true"' : "") + ">+ New trip</button></div></nav>";
    if (newTripOpen) {
      h += '<form class="panel new-trip edit-only" id="trip-form"><h2>New trip</h2>';
      h += '<div><label class="label" for="nt-name">Trip name</label><input id="nt-name" type="text" placeholder="e.g. Gili weekend" required></div>';
      if (state.people.length) h += '<label class="check"><input id="nt-copy" type="checkbox" checked> Same people as ' + esc(state.trip) + " (" + state.people.map(function (p) { return esc(p.name); }).join(", ") + ")</label>";
      h += '<div class="form-actions"><button type="button" class="btn ghost" data-act="newtrip">Cancel</button><button type="submit" class="btn">Create trip</button></div></form>';
    }
    // header
    h += '<header class="top"><div style="min-width:0;flex:1">';
    h += '<p class="eyebrow">Split the bill</p>';
    if (renaming && !ro) {
      h += '<form id="rename-form" class="rename-form"><input class="trip-name" id="trip-name" type="text" value="' + esc(state.trip) + '" aria-label="Trip name" maxlength="40" required>';
      h += '<div class="rename-actions"><button type="submit" class="btn small">Save name</button><button type="button" class="btn ghost small" data-act="rename-cancel">Cancel</button></div></form>';
    } else {
      h += '<div class="title-row"><h1 class="trip-title">' + esc(state.trip) + '</h1><button type="button" class="rename-btn edit-only" data-act="rename" aria-label="Rename ' + esc(state.trip) + '">✎ Rename</button><button type="button" class="rename-btn del edit-only" data-act="deltrip" aria-label="Delete ' + esc(state.trip) + '">🗑 Delete</button></div>';
    }
    h += '</div><div class="top-right">';
    h += '<span id="status" class="status ' + statusClass + '">' + esc(statusText) + "</span>";
    h += "</div></header>";

    if (confirmDelete && !ro) {
      var nb = state.expenses.filter(function (e) { return e.kind !== "payment"; }).length;
      h += '<div class="del-trip" role="alertdialog" aria-label="Delete trip"><p><b>Delete ' + esc(state.trip) + '?</b> This removes its ' + state.people.length + ' people and ' + nb + ' bill' + (nb === 1 ? "" : "s") + ' from this page and from the Google Sheet. It can\'t be undone.</p>';
      h += '<div class="form-actions"><button type="button" class="btn small danger" data-act="deltrip-yes">Delete trip</button><button type="button" class="btn ghost small" data-act="deltrip-no">Keep it</button></div></div>';
    }
    if (ro) h += '<div class="ro-note">You\'re viewing this trip. Only the person who made it can add expenses. Pick your name below to see what you owe.</div>';

    if (state.people.length < 2) {
      h += '<section class="panel"><h2>Who\'s on the trip?</h2><p class="hint">Add at least two people, one at a time. You can add more any time later. Then log each bill with who paid and who shared it, and the page works out the fewest transfers to settle up.</p>';
      h += peopleEditor();
      h += "</section>";
    } else {
      // who am I + settle up
      h += '<section class="panel"><div class="panel-head"><h2>Settle up</h2>';
      h += '<button class="btn ghost small" data-act="copy">Copy summary</button></div>';
      h += '<div class="me-row"><span>I am</span><div class="chips">';
      state.people.forEach(function (p) {
        h += '<button class="chip' + (me === p.id ? " on" : "") + '" data-act="me" data-id="' + p.id + '"><span class="dot" style="--c:var(--' + p.color + ')">' + esc(initials(p.name)) + "</span>" + esc(p.name) + "</button>";
      });
      h += '<button type="button" class="chip add-chip edit-only" data-act="quick" data-where="me">+ Add person</button>';
      h += "</div></div>";
      if (quickAdd === "me") h += quickForm();

      if (me) {
        var mine = transfers.filter(function (t) { return t.from === me || t.to === me; });
        var net = b[me] ? b[me].net : 0;
        var cls = net < -0.005 ? "owe" : net > 0.005 ? "get" : "";
        h += '<div class="you-card ' + cls + '">';
        if (!mine.length) h += '<div class="big">You\'re all square</div>';
        else if (net < 0) h += '<div class="big">You pay ' + fmt(net) + " in total</div>";
        else h += '<div class="big">You get back ' + fmt(net) + " in total</div>";
        mine.forEach(function (t) {
          h += '<div class="hint">' + (t.from === me ? "Pay <b>" + esc(pname(t.to)) + "</b> " : "<b>" + esc(pname(t.from)) + "</b> pays you ") + '<span class="money">' + fmt(t.amt) + "</span></div>";
        });
        h += "</div>";
      }

      if (!transfers.length) {
        h += '<div class="done-note">' + (state.expenses.length ? "Everyone is settled up." : "No bills yet. Add the first one below.") + "</div>";
      } else {
        h += '<div class="transfers">';
        transfers.forEach(function (t, i) {
          var isMine = me && (t.from === me || t.to === me);
          h += '<div class="transfer' + (isMine ? " mine" : "") + '"><div class="who">' + chipHtml(t.from) + '<span class="arrow">pays →</span>' + chipHtml(t.to) + "</div>";
          h += '<span class="amt">' + fmt(t.amt) + "</span>";
          h += '<button class="btn ghost small edit-only" data-act="paid" data-i="' + i + '" title="Record this transfer as paid">Mark paid</button></div>';
        });
        h += "</div>";
      }
      h += "</section>";

      // add / edit expense
      h += '<section class="panel edit-only" id="form-panel"><h2>' + (editingId ? "Edit bill" : "Add a bill") + "</h2>";
      h += '<form id="exp-form" class="form-grid" autocomplete="off">';
      h += '<div class="full scan-row"><label id="scan-label" class="btn ghost scan-btn' + (scan.busy ? " disabled" : "") + '" for="scan-file">📷 Scan receipt</label><input id="scan-file" type="file" accept="image/*" hidden>';
      h += '<div class="seg" role="group" aria-label="How to split"><button type="button" class="' + (bill ? "" : "on") + '" data-act="mode-eq" aria-pressed="' + !bill + '">Split equally</button><button type="button" class="' + (bill ? "on" : "") + '" data-act="mode-item" aria-pressed="' + !!bill + '">Split by item</button></div></div>';
      h += '<p id="scan-status" class="scan-status' + (scan.busy ? " busy" : "") + ' full"' + (scan.msg ? "" : " hidden") + ">" + esc(scan.msg) + "</p>";
      h += '<div><label class="label" for="f-desc">What for</label><input id="f-desc" type="text" placeholder="Dinner, scooter rental, groceries" required></div>';
      if (bill) h += '<div><span class="label">Amount (Rp)</span><div class="amt-auto money" id="amt-auto">' + fmt(computeBill(bill).total) + "</div></div>";
      else h += '<div><label class="label" for="f-amt">Amount (Rp)</label><input id="f-amt" class="formula" type="text" inputmode="decimal" placeholder="e.g. 250000 or 75000*3+50000" required></div>';
      h += '<div><label class="label" for="f-paid">Paid by</label><select id="f-paid">';
      state.people.forEach(function (p) { h += '<option value="' + p.id + '">' + esc(p.name) + "</option>"; });
      h += '</select></div><div><label class="label" for="f-date">Date</label><input id="f-date" type="date"></div>';
      if (bill) h += billEditor();
      else {
      h += '<div class="full"><div class="split-head"><span class="label">Split equally between</span><button type="button" class="linkish" data-act="all">' + (formSplit && formSplit.length === state.people.length ? "Clear" : "Everyone") + "</button></div><div class=\"chips\">";
      if (!formSplit) formSplit = state.people.map(function (p) { return p.id; });
      state.people.forEach(function (p) {
        var on = formSplit.indexOf(p.id) >= 0;
        h += '<button type="button" class="chip ' + (on ? "on" : "off") + '" data-act="split" data-id="' + p.id + '" aria-pressed="' + on + '"><span class="dot" style="--c:var(--' + p.color + ')">' + esc(initials(p.name)) + "</span>" + esc(p.name) + "</button>";
      });
      h += '<button type="button" class="chip add-chip" data-act="quick" data-where="split">+ Add person</button>';
      h += '</div>' + (quickAdd === "split" ? quickForm() : "") + '<div class="each" id="each"></div></div>';
      }
      h += '<p class="inline-msg full" id="form-msg" hidden></p>';
      h += '<div class="form-actions full">' + (editingId ? '<button type="button" class="btn ghost" data-act="cancel">Cancel</button>' : "") + '<button type="submit" class="btn">' + (editingId ? "Update bill" : "Add bill") + "</button></div>";
      h += "</form></section>";

      // balances
      h += '<section class="panel"><div class="panel-head"><h2>Who paid what</h2></div><div class="tbl-wrap"><table><thead><tr><th>Person</th><th>Paid (Rp)</th><th>Share (Rp)</th><th>Balance (Rp)</th></tr></thead><tbody>';
      var totPaid = 0;
      state.people.forEach(function (p) {
        var x = b[p.id]; totPaid += x.paid;
        h += '<tr><td><span class="pname"><span class="dot" style="--c:var(--' + p.color + ')"></span>' + esc(p.name) + "</span></td><td>" + num(x.paid) + "</td><td>" + num(x.share) + '</td><td class="' + (x.net > 0.005 ? "pos" : x.net < -0.005 ? "neg" : "") + '">' + (x.net > 0.005 ? "+" : x.net < -0.005 ? "−" : "") + num(x.net) + "</td></tr>";
      });
      h += "</tbody><tfoot><tr><td>Trip total</td><td>" + num(totPaid) + "</td><td></td><td></td></tr></tfoot></table></div>";
      h += '<p class="hint">+ means they get money back, − means they owe. Transfers marked as paid are already counted.</p>';
      h += '<div class="edit-only" style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px"><span class="label" style="margin:0">People on the trip</span>' + peopleEditor() + "</div>";
      h += "</section>";

      // list
      h += '<section class="panel"><div class="panel-head"><h2>Bills</h2><span class="hint">' + state.expenses.filter(function (e) { return e.kind !== "payment"; }).length + " logged</span></div>";
      if (!state.expenses.length) h += '<div class="empty">Nothing logged yet.</div>';
      else {
        h += '<div class="exp-list">';
        var sorted = state.expenses.slice().sort(function (a, c) { return (c.date || "").localeCompare(a.date || "") || (c.ts || 0) - (a.ts || 0); });
        var lastDay = null;
        sorted.forEach(function (e) {
          if (e.date !== lastDay) { lastDay = e.date; h += '<div class="day">' + esc(dayLabel(e.date)) + "</div>"; }
          var pay = e.kind === "payment";
          var split = (e.split || []).filter(person);
          var meta = pay ? "Settlement" : e.shares
            ? "Paid by " + esc(pname(e.paidBy)) + " · by item · " + Object.keys(e.shares).filter(person).map(function (id) { return esc(pname(id)) + " " + fmt(e.shares[id]); }).join(", ")
            : "Paid by " + esc(pname(e.paidBy)) + " · " + (split.length === state.people.length ? "split by everyone" : "split by " + split.map(pname).map(esc).join(", ")) + (split.length ? " · " + fmt(e.amount / split.length) + " each" : "");
          h += '<div class="exp' + (pay ? " payment" : "") + (editingId === e.id ? " editing" : "") + '"><span class="bar" style="--c:' + pcolor(e.paidBy) + '"></span>';
          h += '<div style="min-width:0"><div class="desc">' + (pay ? esc(pname(e.paidBy)) + " paid " + esc(pname(split[0])) : esc(e.desc)) + '</div><div class="meta">' + meta + "</div></div>";
          h += '<span class="amt">' + fmt(e.amount) + "</span>";
          h += '<span class="acts edit-only">' + (pay ? "" : '<button class="x" data-act="edit" data-id="' + e.id + '" title="Edit" aria-label="Edit">✎</button>') + '<button class="x" data-act="del" data-id="' + e.id + '" title="Delete" aria-label="Delete">✕</button></span></div>';
        });
        h += "</div>";
      }
      h += "</section>";
    }

    h += '<footer class="foot"><span>' + (mode === "sheet" ? "Synced with your Google Sheet. Friends with the link see and add to the same trips." : mode === "shared" ? "Changes save to this page, so anyone with the link sees the latest numbers." : mode === "readonly" ? "Numbers update when the trip owner saves." : "Saved in this browser only.") + "</span><span>All amounts in IDR · sums like 75000*3 work</span></footer>";
    if (mode === "sheet") h += sheetPanel();

    app.innerHTML = h;

    // restore form
    Object.keys(formVals).forEach(function (id) { var el = document.getElementById(id); if (el && formVals[id] != null) el.value = formVals[id]; });
    var dateEl = document.getElementById("f-date");
    if (dateEl && !dateEl.value) dateEl.value = today();
    var paidEl = document.getElementById("f-paid");
    if (paidEl && !formVals["f-paid"] && me) paidEl.value = me;
    if (paidEl && !paidEl.value && state.people[0]) paidEl.value = state.people[0].id;
    updateEach();
    if (focusId) { var f = document.getElementById(focusId); if (f && f.focus) f.focus(); }
  }

  // Adds the name typed in the main "Add person" box, or in a quick "+ Add person" box.
  function addPerson(quick) {
    if (mode === "readonly") return;
    var inp = document.getElementById(quick ? "quick-person" : "new-person"); if (!inp) return;
    var name = inp.value.trim();
    var msgId = quick ? "quick-msg" : "person-msg";
    if (!name) return;
    if (state.people.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) { showMsg(msgId, name + " is already on the list."); return; }
    var used = state.people.map(function (p) { return p.color; });
    var color = PALETTE.filter(function (c) { return used.indexOf(c) < 0; })[0] || PALETTE[state.people.length % PALETTE.length];
    var p = { id: uid(), name: name, color: color };
    state.people.push(p);
    if (formSplit) formSplit.push(p.id);
    inp.value = "";
    changed([{ type: "upsertPerson", person: p }]);
    var again = document.getElementById(quick ? "quick-person" : "new-person"); if (again) { again.value = ""; again.focus(); }
    if (quick) showMsg("quick-msg", "Added " + name + ". Add another, or tap Done.");
  }

  function submitQuick() { addPerson(true); }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "quick-person") { ev.preventDefault(); submitQuick(); }
  });

  // small inline "add a person" form, opened from the + Add person chips
  function quickForm() {
    // a div, not a form: it can sit inside the bill form without nesting forms
    return '<div class="add-person quick" id="quick-form"><input id="quick-person" type="text" placeholder="Name" aria-label="New person\'s name" enterkeyhint="done"><button class="btn small" type="button" data-act="quick-add">Add</button><button class="btn ghost small" type="button" data-act="quick-done">Done</button></div><p class="inline-msg ok-msg" id="quick-msg" hidden></p>';
  }

  function peopleEditor() {
    var h = '<div class="people-edit">';
    state.people.forEach(function (p) {
      h += '<span class="chip"><span class="dot" style="--c:var(--' + p.color + ')">' + esc(initials(p.name)) + "</span>" + esc(p.name) + '<button class="x" data-act="rmp" data-id="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">✕</button></span>';
    });
    h += '</div><form class="add-person" id="person-form"><input id="new-person" type="text" placeholder="Name, e.g. Sam" aria-label="Name"><button class="btn" type="submit">Add person</button></form>';
    h += '<p class="inline-msg" id="person-msg" hidden></p>';
    return h;
  }

  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dayLabel(iso) {
    if (!iso) return "No date";
    var d = new Date(iso + "T12:00:00");
    return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }
  function updateEach() {
    var el = document.getElementById("each"); if (!el) return;
    var amt = evalFormula((document.getElementById("f-amt") || {}).value);
    var n = formSplit ? formSplit.length : 0;

  /* ---------- split by item + receipt scanning ---------- */
  // bill = null (equal split) or { items:[{id,name,price,who:[]}], service:"", tax:"", discount:"", receiptTotal, raw }
  var bill = null;
  var scan = { busy: false, progress: 0, msg: "" };

  function newItem(name, price) { return { id: uid(), name: name || "", price: price == null ? "" : String(price), who: [] }; }

  // "10%" → percent of base, otherwise a number or quick sum. Blank = 0.
  function extraAmount(str, base) {
    str = String(str || "").trim();
    if (!str) return 0;
    var m = str.match(/^(\d+(?:[.,]\d+)?)\s*%$/);
    if (m) return base * parseFloat(m[1].replace(",", ".")) / 100;
    var n = evalFormula(str);
    return isNaN(n) ? NaN : n;
  }

  // Works out each person's share: their items, plus service and tax in proportion, minus discount.
  function computeBill(b) {
    var out = { subtotal: 0, unassigned: 0, perItems: {}, shares: {}, bad: [] };
    state.people.forEach(function (p) { out.perItems[p.id] = 0; });
    b.items.forEach(function (it) {
      var price = evalFormula(it.price);
      if (isNaN(price)) { if (String(it.price).trim()) out.bad.push(it.id); price = 0; }
      out.subtotal += price;
      var who = it.who.filter(function (id) { return out.perItems[id] != null; });
      if (!who.length) { out.unassigned += price; return; }
      who.forEach(function (id) { out.perItems[id] += price / who.length; });
    });
    out.discount = extraAmount(b.discount, out.subtotal);
    var afterDisc = out.subtotal - (out.discount || 0);
    out.service = extraAmount(b.service, afterDisc);
    out.tax = extraAmount(b.tax, afterDisc + (out.service || 0));
    ["discount", "service", "tax"].forEach(function (k) { if (isNaN(out[k])) { out.bad.push(k); out[k] = 0; } });
    out.total = Math.round(afterDisc + out.service + out.tax);
    var assigned = out.subtotal - out.unassigned;
    var factor = assigned > 0 ? out.total / out.subtotal : 0;
    // round to whole rupiah, and put any leftover rupiah on the biggest share so it adds up exactly
    var ids = Object.keys(out.perItems).filter(function (id) { return out.perItems[id] > 0; });
    var sum = 0, biggest = null;
    ids.forEach(function (id) {
      out.shares[id] = Math.round(out.perItems[id] * factor);
      sum += out.shares[id];
      if (!biggest || out.shares[id] > out.shares[biggest]) biggest = id;
    });
    if (biggest && !out.unassigned) out.shares[biggest] += out.total - sum;
    return out;
  }

  function billSummary(c) {
    var h = '<div class="sum-lines">';
    h += '<div><span>Items</span><span class="money">' + fmt(c.subtotal) + "</span></div>";
    if (c.discount) h += '<div><span>Discount</span><span class="money">−' + fmt(c.discount) + "</span></div>";
    if (c.service) h += '<div><span>Service</span><span class="money">' + fmt(c.service) + "</span></div>";
    if (c.tax) h += '<div><span>Tax</span><span class="money">' + fmt(c.tax) + "</span></div>";
    h += '<div class="grand"><span>Bill total</span><span class="money">' + fmt(c.total) + "</span></div></div>";
    if (bill.receiptSubtotal) {
      h += Math.round(bill.receiptSubtotal) === Math.round(c.subtotal)
        ? '<p class="check ok">✓ Items add up to the receipt subtotal of ' + fmt(bill.receiptSubtotal) + "</p>"
        : '<p class="check warn">Items add up to ' + fmt(c.subtotal) + ", but the receipt subtotal says " + fmt(bill.receiptSubtotal) + ". An item may be missing or misread.</p>";
    }
    if (bill.receiptTotal) {
      var diff = Math.round(bill.receiptTotal - c.total);
      // a few rupiah off is the scanner misreading a digit of the total, not a real difference
      h += Math.abs(diff) <= Math.max(1, c.total * 0.0005)
        ? '<p class="check ok">✓ Matches the receipt total of ' + fmt(c.total) + "</p>"
        : '<p class="check warn">The receipt says ' + fmt(bill.receiptTotal) + ", " + fmt(diff) + (diff > 0 ? " more" : " less") + " than this. Check the prices, service and tax.</p>";
    }
    if (c.unassigned) h += '<p class="check warn">' + fmt(c.unassigned) + " of items isn't assigned to anyone yet.</p>";
    var ids = Object.keys(c.shares);
    if (ids.length) {
      h += '<div class="per-person">';
      state.people.forEach(function (p) {
        if (!c.shares[p.id]) return;
        var fees = c.shares[p.id] - Math.round(c.perItems[p.id]);
        h += '<div><span class="pname"><span class="dot" style="--c:var(--' + p.color + ')"></span>' + esc(p.name) + '</span><span class="muted money">' + num(c.perItems[p.id]) + (fees ? (fees > 0 ? " + " : " − ") + num(fees) : "") + '</span><b class="money">' + fmt(c.shares[p.id]) + "</b></div>";
      });
      h += "</div>";
    }
    return h;
  }

  function refreshBillSummary() {

  function findItem(id) { return bill && bill.items.filter(function (x) { return x.id === id; })[0]; }

  /* --- receipt reading (Tesseract.js, runs on the phone; nothing is uploaded) --- */
  var tessPromise = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (tessPromise) return tessPromise;
    tessPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      s.onload = function () { resolve(window.Tesseract); };
      s.onerror = function () { tessPromise = null; reject(new Error("Couldn't load the scanner. Check your internet connection.")); };
      document.head.appendChild(s);
    });
    return tessPromise;
  }

  // Finds the paper, crops away the table around it, then turns it into clean black text on white
  // (adaptive threshold, so shadows and a dark background don't swallow the print).
  function prepareImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        try { resolve(cleanReceipt(img)); } catch (e) { reject(e); }
        URL.revokeObjectURL(url);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("That file isn't a photo the browser can open. Try a JPG or PNG.")); };
      img.src = url;
    });
  }

  function grayOf(canvas) {
    var g = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
    var out = new Float32Array(canvas.width * canvas.height);
    for (var i = 0, j = 0; i < g.length; i += 4, j++) out[j] = 0.299 * g[i] + 0.587 * g[i + 1] + 0.114 * g[i + 2];
    return out;
  }

  function cleanReceipt(img) {
    // 1. find the bright paper on a small copy
    var sw = Math.min(600, img.width), sh = Math.round(img.height * sw / img.width);
    var small = document.createElement("canvas"); small.width = sw; small.height = sh;
    small.getContext("2d").drawImage(img, 0, 0, sw, sh);
    var s = grayOf(small), colHit = new Array(sw).fill(0), rowHit = new Array(sh).fill(0);
    for (var y = 0; y < sh; y++) for (var x = 0; x < sw; x++) if (s[y * sw + x] > 170) { colHit[x]++; rowHit[y]++; }
    var xs = [], ys = [];
    colHit.forEach(function (n, x) { if (n / sh > 0.35) xs.push(x); });
    rowHit.forEach(function (n, y) { if (n / sw > 0.25) ys.push(y); });
    var k = img.width / sw, cx = 0, cy = 0, cw = img.width, ch = img.height;
    if (xs.length > sw * 0.25 && ys.length > sh * 0.25) {
      cx = Math.max(0, (xs[0] - 4) * k); cy = Math.max(0, (ys[0] - 4) * k);
      cw = Math.min(img.width - cx, (xs[xs.length - 1] - xs[0] + 8) * k);
      ch = Math.min(img.height - cy, (ys[ys.length - 1] - ys[0] + 8) * k);
    }
    // 2. draw the paper at a size the reader likes (about 1800 px wide)
    var scale = Math.min(3, 1800 / cw);
    var c = document.createElement("canvas");
    c.width = Math.round(cw * scale); c.height = Math.round(ch * scale);
    var ctx = c.getContext("2d");
    ctx.drawImage(img, cx, cy, cw, ch, 0, 0, c.width, c.height);
    // 3. adaptive threshold with an integral image
    var W = c.width, H = c.height, g = grayOf(c), I = new Float64Array((W + 1) * (H + 1));
    for (y = 1; y <= H; y++) {
      var row = 0;
      for (x = 1; x <= W; x++) { row += g[(y - 1) * W + x - 1]; I[y * (W + 1) + x] = I[(y - 1) * (W + 1) + x] + row; }
    }
    var r = Math.max(8, Math.round(W / 72)), d = ctx.getImageData(0, 0, W, H), px = d.data;
    for (y = 0; y < H; y++) {
      var y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
      for (x = 0; x < W; x++) {
        var x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
        var sum = I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0];
        var mean = sum / ((x1 - x0) * (y1 - y0));
        var v = g[y * W + x] < mean - 12 ? 0 : 255, p = (y * W + x) * 4;
        px[p] = px[p + 1] = px[p + 2] = v; px[p + 3] = 255;
      }
    }
    ctx.putImageData(d, 0, 0);
    return c;
  }

  function setScan(busy, progress, msg) {
    scan = { busy: busy, progress: progress, msg: msg };
    var el = document.getElementById("scan-status");
    if (el) { el.textContent = msg; el.hidden = !msg; el.className = "scan-status full" + (busy ? " busy" : ""); }
    var btn = document.getElementById("scan-label");
    if (btn) btn.classList.toggle("disabled", busy);
  }

  function scanReceipt(file) {
    if (!file || scan.busy) return;
    setScan(true, 0, "Loading the scanner…");
    var canvasP = prepareImage(file);
    loadTesseract().then(function (T) {
      return canvasP.then(function (canvas) {
        return T.createWorker("eng", 1, {
          logger: function (m) {
            if (m.status === "recognizing text") setScan(true, m.progress, "Reading receipt… " + Math.round(m.progress * 100) + "%");
            else if (/loading|initializ/.test(m.status)) setScan(true, 0, "Getting the scanner ready…");
          }
        }).then(function (worker) {
          return worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" })
            .then(function () { return worker.recognize(canvas); })
            .then(function (res) { worker.terminate(); return res.data.text; });
        });
      });
    }).then(function (text) {
      var r = parseReceipt(text);
      bill = { items: r.items.length ? r.items.map(function (x) { return newItem(x.name, x.price); }) : [newItem()], service: r.service ? String(r.service) : "", tax: r.tax ? String(r.tax) : "", discount: r.discount ? String(r.discount) : "", receiptTotal: r.total || null, receiptSubtotal: r.subtotal || null, raw: text };
      var descEl = document.getElementById("f-desc");
      if (descEl && !descEl.value.trim() && r.merchant) descEl.value = r.merchant;
      setScan(false, 1, r.items.length ? "Found " + r.items.length + " item" + (r.items.length === 1 ? "" : "s") + ". Check them, then tap who had what." : "Couldn't find any items. Add them below, or try a sharper, flatter photo.");
      render();
    }).catch(function (err) {
      setScan(false, 0, (err && err.message) || "Couldn't read that receipt.");
    });
  }

  // Turns receipt text into items + service / tax / discount / total.
  function parseReceipt(text) {
    var out = { items: [], service: 0, tax: 0, discount: 0, total: 0, subtotal: 0, merchant: "" };
    function fixName(n) { return n.replace(/([A-Za-z])0|0([A-Za-z])/g, function (m, a, b) { return a ? a + "O" : "O" + b; }); }
    var NUM = /(?:rp\.?\s*)?(-?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|-?\d{4,}(?:[.,]\d{2})?)\s*-?\s*$/i;
    function toNumber(s) {
      s = s.replace(/\s/g, "");
      var neg = s.charAt(0) === "-";
      s = s.replace(/^-/, "").replace(/[.,]\d{2}$/, function (m) { return /[.,]\d{3}/.test(s) || s.length > 6 ? "" : m; });
      var n = parseInt(s.replace(/[.,]/g, ""), 10);
      return isNaN(n) ? 0 : (neg ? -n : n);
    }
    var SKIP = /\b(?:cash|tunai|change|kembali|card|kartu|debit|credit|kredit|qris|gopay|ovo|dana|shopee|bayar|payment|paid|rounding|pembulatan|table|meja|guest|tamu|pax|cashier|kasir|date|tanggal|jam|time|invoice|receipt|struk|bill\s*no|no\.|order|telp|phone|npwp|www|thank|terima\s*kasih|wifi|password|member|point|poin|bca|mandiri|bni|bri|edc|approval|trace|ref)(?![a-z])/i;
    var lines = text.split(/\n/).map(function (l) { return l.replace(/[|_~`'"]+/g, " ").replace(/\s+/g, " ").trim(); }).filter(Boolean);
    for (var li = 0; li < Math.min(4, lines.length); li++) {
      if (/[a-z]{3,}/i.test(lines[li]) && !NUM.test(lines[li]) && !SKIP.test(lines[li])) { out.merchant = lines[li].replace(/[^\w &'.-]/g, "").trim().slice(0, 40); break; }
    }
    // Receipts that print "1x @69.000   69.000" under each item name (very common in Indonesia):
    // take the line total from those rows and the name from the line above; skip free add-ons (@0).
    var QTY = /(?:^|\s)(\d{1,2}|[Il|])\s*[xX×]\s+(\S*)\s*(.*)$/;
    var qtyRows = lines.filter(function (l) { return QTY.test(l) && !/[a-z]{4,}/i.test(l.replace(QTY, "")); });
    if (qtyRows.length >= 2) {
      var lastName = "";
      lines.forEach(function (line) {
        var low = line.toLowerCase();
        var q = line.match(QTY);
        var before = q ? line.slice(0, q.index) : line;
        if (q && !/[a-z]{3,}/i.test(before)) {
          var nums = (q[2] + " " + q[3]).match(/\d{1,3}(?:[.,]\d{3})+|\d+/g) || [];
          var lineTotal = nums.length ? toNumber(nums[nums.length - 1]) : 0;
          if (lineTotal >= 100 && lastName) {
            var qty = /^\d+$/.test(q[1]) ? parseInt(q[1], 10) : 1;
            out.items.push({ name: (qty > 1 ? qty + "× " : "") + fixName(lastName), price: lineTotal });
          }
          lastName = "";
          return;
        }
        var m = line.match(NUM), amount = m ? Math.abs(toNumber(m[1])) : 0;
        if (m && amount >= 100) {
          if (/sub\s*-?\s*total/i.test(low)) { out.subtotal = amount; return; }
          if (/total|jumlah|amount\s*due|tagihan/i.test(low)) { out.total = Math.max(out.total, amount); return; }
          if (/service|servis|srv|svc|s\/c|\bsc\b|layanan/i.test(low)) { out.service += amount; return; }
          if (/\btax\b|pajak|pb\s*1|pbi|ppn|vat/i.test(low)) { out.tax += amount; return; }
          if (/disc|diskon|potongan|promo|voucher/i.test(low)) { out.discount += amount; return; }
        }
        // a possible item name: drop stray OCR marks at the start/end
        var nm = line.replace(/^.*?(?=[A-Za-z]{2})/, "").replace(/[^A-Za-z0-9)]+$/, "").trim();
        if (/[a-z]{3,}/i.test(nm) && !SKIP.test(nm) && !/\bitems?\b/i.test(nm)) lastName = nm.slice(0, 40);
      });
      return out;
    }

    var pendingName = "";
    lines.forEach(function (line, i) {
      var low = line.toLowerCase();
      var m = line.match(NUM);
      if (!m) {
        // a name on its own line, with the price on the next line
        pendingName = /[a-z]{3,}/i.test(line) && !SKIP.test(line) && line.length < 40 ? line : "";
        return;
      }
      var amount = Math.abs(toNumber(m[1]));
      var label = line.slice(0, m.index).trim();
      if (!/[a-z]{2,}/i.test(label) && pendingName) label = pendingName;
      pendingName = "";
      if (amount < 100) return;
      if (/sub\s*-?\s*total|subtotal|sub tot/i.test(low)) { out.subtotal = amount; return; }
      if (/grand\s*total|\btotal\b|jumlah|amount\s*due|tagihan|net\s*total/i.test(low)) { if (!/qty|item/i.test(low)) out.total = Math.max(out.total, amount); return; }
      if (/service|servis|srv|svc|s\/c|layanan/i.test(low)) { out.service += amount; return; }
      if (/\btax\b|pajak|pb\s*1|pb1|ppn|vat|resto\s*tax/i.test(low)) { out.tax += amount; return; }
      if (/disc|diskon|potongan|promo|voucher/i.test(low)) { out.discount += amount; return; }
      if (SKIP.test(low)) return;
      // tidy the name: drop unit prices like "2 x 25.000" and stray symbols
      var name = label.replace(/(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?/gi, "").replace(/\s[x@]\s*$/i, "").replace(/[^\w &'()\/.+-]/g, " ").replace(/\s+/g, " ").trim();
      var q = name.match(/^(\d{1,2})\s*[xX]?\s+(.+)$/) || name.match(/^(.+?)\s+[xX]?\s*(\d{1,2})$/);
      if (q) name = /^\d/.test(q[1]) ? q[1] + "× " + q[2] : q[2] + "× " + q[1];
      if (!/[a-z]{2,}/i.test(name)) return;
      out.items.push({ name: fixName(name).slice(0, 40), price: amount });
    });
    // the biggest amount is the total, not an item, when no "total" line was read
    if (!out.total && out.items.length > 2) {
      var sum = 0, maxI = 0;
      out.items.forEach(function (x, i) { sum += x.price; if (x.price > out.items[maxI].price) maxI = i; });
      if (Math.abs(out.items[maxI].price * 2 - sum) < out.items[maxI].price * 0.05 + 2) { out.total = out.items[maxI].price; out.items.splice(maxI, 1); }
    }
    return out;
  }

  /* ---------- Google Sheet sync (standalone file only) ---------- */
  var sheetLink = lsGet("splitbill_sheet_link") || "", sheetError = "";

  function hasTrip(a) { return a.trips.some(function (t) { return t.people.length || t.expenses.length; }); }

  function sheetPanel() {
    var h = '<details class="panel sheet-panel" id="sheet-panel"' + (sheetOpen ? " open" : "") + '><summary><span>Google Sheet</span><span class="hint">' + (sheetError ? "Problem" : "Connected") + "</span></summary>";
    h += '<p class="hint">Every bill saves to the trip\'s Google Sheet, and the page checks for friends\' changes every 30 seconds. Anyone who opens this page shares the same trip.</p>';
    if (sheetError) h += '<p class="inline-msg">' + esc(sheetError) + "</p>";
    h += '<div class="form-actions" style="justify-content:flex-start">';
    if (sheetLink) h += '<a class="btn ghost small" href="' + esc(sheetLink) + '" target="_blank" rel="noopener">Open the sheet</a>';
    h += '<button type="button" class="btn ghost small" data-act="upload">Send this phone\'s bills to the sheet</button>';
    h += '<button type="button" class="btn ghost small" data-act="sync">Refresh now</button>';
    h += '<button type="button" class="btn ghost small" data-act="invite">Copy link for friends</button></div>';
    return h + "</details>";
  }

  function jsonp(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cb = "__splitbill_" + Math.random().toString(36).slice(2);
      var tag = document.createElement("script");
      var timer = setTimeout(function () { done(); reject(new Error("The sheet didn't answer in time.")); }, timeoutMs || 20000);
      function done() { clearTimeout(timer); delete window[cb]; tag.remove(); }
      window[cb] = function (data) { done(); resolve(data); };
      tag.onerror = function () { done(); reject(new Error("Couldn't reach the sheet. Check the Web app access is set to Anyone.")); };
      tag.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
      document.head.appendChild(tag);
    });
  }

  function sheetFailed(err) {
    sheetError = (err && err.message) || String(err);
    setStatus(navigator.onLine === false ? "Offline · showing last copy" : "Sheet problem · see below", "saving");
    render();
  }

  function gotSheetInfo(res) {
    if (res.sheet && res.sheet !== sheetLink) { sheetLink = res.sheet; lsSet("splitbill_sheet_link", sheetLink); }
    if (sheetError) { sheetError = ""; render(); }
  }

  var lastSheetJson = "";
  app.addEventListener("toggle", function (ev) { if (ev.target.id === "sheet-panel") sheetOpen = ev.target.open; }, true);

  function pullSheet(force) {
    if (outbox.length && !force) return Promise.resolve();
    return jsonp(sheetUrl).then(function (res) {
      if (!res || !res.ok) throw new Error("The sheet replied with an error: " + ((res && res.error) || "unknown"));
      gotSheetInfo(res);
      if (outbox.length) return; // this phone's edits are still on their way
      var incoming = normalize(res.state);
      if (!hasTrip(incoming) && hasTrip(all)) {
        // The sheet is empty but this phone already has a trip: send it up, never wipe it.
        uploadAll();
        return;
      }
      var js = JSON.stringify(res.state);
      if (js !== lastSheetJson) {
        lastSheetJson = js;
        all = incoming;
        pick();
        lsSet(LS_LOCAL, JSON.stringify(all));
        render();
      }
      setStatus("Synced", "saved");
    }).catch(sheetFailed);
  }

  function uploadAll() {
    var ops = [];
    all.trips.forEach(function (t) {
      ops.push({ type: "createTrip", trip: { id: t.id, name: t.trip, created: t.created } });
      t.people.forEach(function (p) { ops.push({ type: "upsertPerson", tripId: t.id, person: p }); });
      t.expenses.forEach(function (x) { ops.push({ type: "upsertExpense", tripId: t.id, expense: x }); });
    });
    queueOps(ops); // upserts by id, so sending twice never duplicates
  }

  function queueOps(ops) {
    if (!ops.length) return;
    outbox = outbox.concat(ops);
    lsSet(LS_OUTBOX, JSON.stringify(outbox));
    flushOutbox();
  }

  // Send queued changes in small batches over JSONP, so each one is confirmed by the sheet.
  function nextBatch() {
    var batch = [];
    for (var i = 0; i < outbox.length; i++) {
      var trial = batch.concat([outbox[i]]);
      if (batch.length && encodeURIComponent(JSON.stringify(trial)).length > 1500) break;
      batch = trial;
    }
    return batch;
  }

  var flushing = false, retryTimer = null;
  function flushOutbox() {
    if (flushing || !outbox.length) return;
    flushing = true;
    var batch = nextBatch();
    setStatus("Saving to sheet… " + outbox.length + " left", "saving");
    jsonp(sheetUrl + "?action=write&ops=" + encodeURIComponent(JSON.stringify(batch))).then(function (res) {
      if (!res || !res.ok) throw new Error("The sheet refused the change: " + ((res && res.error) || "unknown"));
      gotSheetInfo(res);
      outbox = outbox.slice(batch.length);
      lsSet(LS_OUTBOX, JSON.stringify(outbox));
      flushing = false;
      if (outbox.length) flushOutbox();
      else { setStatus("Saved to sheet", "saved"); setTimeout(function () { pullSheet(); }, 1500); }
    }).catch(function (err) {
      flushing = false;
      sheetFailed(err);
      setStatus(outbox.length + " change" + (outbox.length === 1 ? "" : "s") + " waiting to save", "saving");
      clearTimeout(retryTimer);
      retryTimer = setTimeout(flushOutbox, 20000);
    });
  }

  function goSheet() {
    mode = "sheet";
    if (local) { try { all = normalize(JSON.parse(local)); pick(); } catch (e) {} }
    setStatus("Connecting…", "saving");
    render();
    if (outbox.length) flushOutbox(); else pullSheet();
    setInterval(function () { if (!document.hidden) { if (outbox.length) flushOutbox(); else pullSheet(); } }, 30000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) pullSheet(); });
    window.addEventListener("online", flushOutbox);
  }

  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]"); if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "sync") { if (outbox.length) flushOutbox(); else pullSheet(true); }
    if (act === "upload") { uploadAll(); t.textContent = "Sending…"; }
    if (act === "invite") {
      var link = location.href.split("?")[0].split("#")[0];
      var done = function () { t.textContent = "Link copied"; setTimeout(function () { t.textContent = "Copy link for friends"; }, 1600); };
      try { navigator.clipboard.writeText(link).then(done, function () { fallback(link); done(); }); } catch (e) { fallback(link); done(); }
    }
  });

  /* ---------- boot ---------- */
  var local = lsGet(LS_LOCAL);
  setStatus("Loading…", "");
  render();

  function goLocal() {
    mode = "local";
    if (local) { try { all = normalize(JSON.parse(local)); pick(); } catch (e) {} }
    setStatus("Saved on this device", "saved");
    render();
  }

  // Opened directly (or in a plain preview frame): use the Google Sheet.
  // Only inside a Claude artifact, which can't reach Google, does the page save itself instead.
  var tries = 0;
  if (!embedded) { goSheet(); return; }
  (function waitForHost() {
    if (window.claude && typeof window.claude.use === "function") connect();
    else if (++tries < 15) setTimeout(waitForHost, 100);
    else goSheet();
  })();

  function connect() {
    Promise.all([
      window.claude.use("artifact").catch(function () { return null; }),
      window.claude.use("user").catch(function () { return null; })
    ]).then(function (res) {
      artifactApi = res[0];
      var user = res[1];
      if (!artifactApi) { goLocal(); return; }
      var canEdit = user && user.canEdit ? user.canEdit().catch(function () { return true; }) : Promise.resolve(true);
      canEdit.then(function (ok) {
        mode = ok ? "shared" : "readonly";
        setStatus(ok ? "Saved" : "View only", ok ? "saved" : "");
        render();
      });
    });
  }
})();
</script>

</body>
</html>
